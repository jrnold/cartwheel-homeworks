<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartwheel review</title>
<style>
/* Colors are tokens so one stylesheet serves both themes. Light is the base;
   dark applies when the OS asks for it (unless the reviewer pinned light) or
   when the reviewer pinned dark. The theme button cycles auto, light, dark. */
:root {
  color-scheme: light;
  --bg: #f5f6f8; --panel: #ffffff; --panel2: #eff1f4; --line: #d8dce3; --line2: #e8eaee;
  --hover: #e4e8ee; --on-bg: #dce7fb; --on-line: #7d9fe0; --focus: #4a78d0;
  --ink: #1b1f27; --ink2: #2f3541; --dim: #5a6374; --faint: #818899; --ghost: #c5cad3;
  --strong: #000;
  --user: #2d6bd3; --asst: #12805a; --tool: #9a6a0c; --err: #c7303f;
  --floor: #12805a; --llm: #8547b3; --fail: #c7303f; --pass: #1a8551;
  --fail-bg: #fbe1e4; --fail-line: #e3949c; --pass-bg: #d9f2e5; --pass-line: #67b98f;
  --warn-line: #eab3b9; --role-line: #b3c9ef; --batch-line: #a9d9c3; --off-line: #e6cf9c;
  --note-bg: #fdf6e4; --note-line: #ecd8a6; --note-accent: #c2891a;
  --sugg-bg: #f6effb; --sugg-line: #dcc7ee;
  --code-bg: #f0f2f5; --code-ink: #85550e;
  --cur-row: #e6eefc; --selection: #b9d0f7;
  --shadow: 0 8px 26px rgba(20, 30, 50, .18); --overlay: rgba(30, 35, 45, .35);
  --toast-bg: #1f2430; --toast-ink: #f2f4f8;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12141a; --panel: #191c24; --panel2: #1f232d; --line: #2c313d; --line2: #232733;
    --hover: #2a2f3b; --on-bg: #35507d; --on-line: #4a6ba8; --focus: #4a6ba8;
    --ink: #e6e9f0; --ink2: #cdd4e2; --dim: #949cb0; --faint: #6b7385; --ghost: #3d4454;
    --strong: #fff;
    --user: #6ea8fe; --asst: #7ee0b8; --tool: #e0b96e; --err: #ef7a85;
    --floor: #7ee0b8; --llm: #c08ce0; --fail: #ef7a85; --pass: #6ee7a8;
    --fail-bg: #5c2730; --fail-line: #8c3b48; --pass-bg: #1d5038; --pass-line: #2f7a55;
    --warn-line: #6b3038; --role-line: #2c4470; --batch-line: #2c5a48; --off-line: #6b5730;
    --note-bg: #221d14; --note-line: #4a3a1c; --note-accent: #d9a441;
    --sugg-bg: #1e1a26; --sugg-line: #40325c;
    --code-bg: #14171f; --code-ink: #d3b98a;
    --cur-row: #232a3a; --selection: #3a5b8c;
    --shadow: 0 8px 26px rgba(0, 0, 0, .55); --overlay: rgba(8, 10, 14, .72);
    --toast-bg: #2b3242; --toast-ink: #e6e9f0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12141a; --panel: #191c24; --panel2: #1f232d; --line: #2c313d; --line2: #232733;
  --hover: #2a2f3b; --on-bg: #35507d; --on-line: #4a6ba8; --focus: #4a6ba8;
  --ink: #e6e9f0; --ink2: #cdd4e2; --dim: #949cb0; --faint: #6b7385; --ghost: #3d4454;
  --strong: #fff;
  --user: #6ea8fe; --asst: #7ee0b8; --tool: #e0b96e; --err: #ef7a85;
  --floor: #7ee0b8; --llm: #c08ce0; --fail: #ef7a85; --pass: #6ee7a8;
  --fail-bg: #5c2730; --fail-line: #8c3b48; --pass-bg: #1d5038; --pass-line: #2f7a55;
  --warn-line: #6b3038; --role-line: #2c4470; --batch-line: #2c5a48; --off-line: #6b5730;
  --note-bg: #221d14; --note-line: #4a3a1c; --note-accent: #d9a441;
  --sugg-bg: #1e1a26; --sugg-line: #40325c;
  --code-bg: #14171f; --code-ink: #d3b98a;
  --cur-row: #232a3a; --selection: #3a5b8c;
  --shadow: 0 8px 26px rgba(0, 0, 0, .55); --overlay: rgba(8, 10, 14, .72);
  --toast-bg: #2b3242; --toast-ink: #e6e9f0;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.5 system-ui, -apple-system, sans-serif;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
button {
  font: inherit; color: var(--ink); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px;
  cursor: pointer;
}
button:hover { background: var(--hover); }
button.on { background: var(--on-bg); border-color: var(--on-line); }
select, input {
  font: inherit; color: var(--ink); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px;
}
code, .mono { font-family: var(--mono); font-size: 12px; }
a { color: var(--user); }

/* ---- header ----
   App-level controls only. What belongs to the trace being read (its id,
   pills, tool detail) sits on the transcript column instead, and the trace
   navigation shows only on the views it drives. */
header {
  display: flex; align-items: center; gap: 10px; padding: 6px 12px;
  background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
header .grow { flex: 1; }
header .id, .tracebar .id { font-family: var(--mono); font-size: 12px; color: var(--dim); }
#nav { display: flex; align-items: center; gap: 6px; }
#nav[hidden] { display: none; }
#filter { max-width: 240px; }
#themebtn, #helpbtn { padding: 1px 8px; font-size: 12px; }
.tabs { display: flex; gap: 4px; }
.pill {
  font-size: 11px; padding: 1px 7px; border-radius: 9px;
  border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
}
.pill.role { color: var(--user); border-color: var(--role-line); }
.pill.warn { color: var(--err); border-color: var(--warn-line); }
/* Sample provenance. A trace either came from a manifest batch or it did not,
   and the reviewer has to be able to tell at a glance: only the first kind
   counts toward the 100, and the second kind is what a depth search returns. */
.pill.batch { color: var(--asst); border-color: var(--batch-line); }
.pill.off { color: var(--tool); border-color: var(--off-line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 10px; }

/* ---- layout ---- */
main { flex: 1; display: grid; grid-template-columns: 280px 1fr 320px; overflow: hidden; min-height: 0; }
main.wide { grid-template-columns: 1fr; }
.col { overflow-y: auto; padding: 10px 12px; min-height: 0; }
.col.left { background: var(--panel); border-right: 1px solid var(--line); }
.col.right { background: var(--panel); border-left: 1px solid var(--line); }
/* The transcript scrolls under a fixed trace bar, so #convo owns its scroll
   position and a re-render can put it back. */
.col.mid { padding: 0; display: none; flex-direction: column; overflow: hidden; }
.col.mid.active { display: flex; }
.tracebar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--bg);
}
.tracebar .grow { flex: 1; }
#toolbtn { font-size: 11.5px; padding: 1px 8px; }
#convo { flex: 1; overflow-y: auto; padding: 10px 12px; min-height: 0; }
.view { display: none; }
.view.active { display: block; }

h4 {
  margin: 14px 0 6px; font-size: 10px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--faint); font-weight: 600;
}
h4:first-child { margin-top: 0; }

/* ---- left column sections ---- */
details.sec { margin-bottom: 12px; }
details.sec > summary {
  list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 6px;
  font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--faint); font-weight: 600; margin-bottom: 6px;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: "▸"; font-size: 9px; }
details.sec[open] > summary::before { content: "▾"; }
.scenline { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); margin-bottom: 4px; word-break: break-word; }
.expected { font-size: 11.5px; color: var(--ink2); white-space: pre-wrap; margin: 4px 0; }
.more { margin-top: 4px; }
.more > summary { cursor: pointer; font-size: 11px; color: var(--faint); }

/* ---- conversation ---- */
.turnsep {
  display: flex; align-items: center; gap: 8px; margin: 16px 0 10px;
  color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
}
.turnsep:first-child { margin-top: 0; }
.turnsep::before, .turnsep::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}
.step {
  position: relative; margin: 0 0 7px; padding: 7px 10px 7px 12px;
  background: var(--panel2); border-radius: 6px; border-left: 3px solid var(--line);
}
.step.prior { opacity: .55; }
.step.user { border-left-color: var(--user); }
.step.assistant { border-left-color: var(--asst); }
.step.tool_call, .step.tool_result { border-left-color: var(--tool); }
.step.bad { border-left-color: var(--err); }
/* Compact tool steps: the call and its result on one line, no role label.
   The result keeps its own data-key inside, so a note anchored to it still
   finds its step. */
.step.tool_call.pair { padding: 4px 10px 4px 12px; margin-bottom: 5px; }
.step.pair .call { display: inline; }
.step.pair .res { display: inline; }
.step.pair .res .summary { display: inline-flex; margin-left: 6px; }
/* An assistant message before the turn's final reply. The server returns only
   final_output, so the user never sees these; they read as process, like tool
   steps, and share the tool detail level. */
.step.interim { border-left-style: dashed; }
.step.interim .txt { color: var(--dim); }
.step.interim .who .toggle { cursor: pointer; color: var(--asst); }
.step.interim.compact { padding-top: 4px; padding-bottom: 4px; }
.step.interim.compact:not(.open) .txt {
  max-height: 1.45em; overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, #000 85%, transparent);
  mask-image: linear-gradient(to right, #000 85%, transparent);
}
.step .who {
  font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); margin-bottom: 3px;
  display: flex; align-items: center; gap: 7px;
}
.step.interim.compact .who { float: left; margin: 0 8px 0 0; line-height: 1.45rem; }
.step .txt { white-space: pre-wrap; word-break: break-word; }
.step .txt.mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink2); }
.step .note-btn {
  position: absolute; right: 5px; top: 4px; opacity: 0;
  font-size: 11px; padding: 1px 7px;
}
.step:hover .note-btn { opacity: 1; }
.step.hasnote { box-shadow: inset 2px 0 0 var(--note-accent); }
.step.pair .res.hasnote .summary { text-decoration: underline var(--note-accent); }

.summary {
  font-family: var(--mono); font-size: 11.5px; color: var(--dim);
  cursor: pointer; display: flex; gap: 7px; align-items: baseline;
}
.summary:hover { color: var(--ink); }
.summary .ok { color: var(--pass); }
.summary .no { color: var(--err); }
.summary .arr { color: var(--faint); }
.full {
  display: none; margin-top: 6px; padding: 7px; background: var(--code-bg);
  border-radius: 4px; font-family: var(--mono); font-size: 11px;
  white-space: pre-wrap; word-break: break-all; max-height: 380px; overflow: auto;
  color: var(--ink2);
}
.full.open { display: block; }

/* ---- spec panel ---- */
.req { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; }
.req .hd {
  display: flex; align-items: baseline; gap: 7px; padding: 5px 8px; cursor: pointer;
}
.req .hd:hover { background: var(--panel2); }
.req .rid, .chip.rid { font-family: var(--mono); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.req.floor .rid, .chip.floor { color: var(--floor); }
.req.llm .rid, .chip.llm { color: var(--llm); }
.req .why { font-size: 11px; color: var(--dim); line-height: 1.35; }
.req .bd, .reqbd {
  display: none; padding: 7px 9px; border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--ink2); white-space: pre-wrap;
}
.reqbd { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; }
.req .bd.open, .reqbd.open { display: block; }
.src {
  font-size: 9px; letter-spacing: .06em; text-transform: uppercase;
  padding: 0 4px; border-radius: 3px; border: 1px solid var(--line); color: var(--faint);
}
table.matrix { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; white-space: normal; }
table.matrix td { padding: 2px 4px; border-bottom: 1px solid var(--line2); }
table.matrix td:last-child { color: var(--asst); font-family: var(--mono); text-align: right; }

/* ---- chips (spec ids, trace ids) ---- */
.chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--mono); font-size: 11px; padding: 0 6px; line-height: 18px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--panel2);
  cursor: pointer; color: var(--ink2);
}
.chip:hover { border-color: var(--dim); }
.chip.unknown { color: var(--err); border-color: var(--warn-line); }
.chip .x { border: 0; background: none; padding: 0 0 0 2px; color: var(--faint); font-size: 12px; line-height: 1; }
.chip .x:hover { color: var(--err); background: none; }
input.chipadd { font-family: var(--mono); font-size: 11px; width: 150px; padding: 1px 6px; }

/* ---- facts ---- */
.fact { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; font-size: 11.5px; }
.fact .k { color: var(--faint); }
.fact .v { font-family: var(--mono); text-align: right; word-break: break-all; }
.fact .v.hot { color: var(--err); }

/* ---- right column ---- */
.paneseg { display: flex; margin-bottom: 10px; }
.paneseg button { flex: 1; }
.paneseg .cnt { font-size: 10.5px; color: var(--faint); margin-left: 4px; }
.paneseg .cnt.bad { color: var(--err); }
.pane[hidden] { display: none; }
.row { display: flex; gap: 5px; margin: 6px 0; }

/* ---- notes ---- */
.note {
  background: var(--note-bg); border: 1px solid var(--note-line); border-left: 3px solid var(--note-accent);
  border-radius: 5px; padding: 7px 9px; margin-bottom: 7px; font-size: 12px;
}
.note .quoted {
  font-size: 11px; color: var(--dim); font-style: italic;
  border-left: 2px solid var(--note-accent); padding-left: 6px; margin-bottom: 5px;
}
.note .meta {
  font-size: 10px; color: var(--faint); margin-top: 5px;
  display: flex; justify-content: space-between; gap: 6px;
}
.note .meta button { padding: 0 5px; font-size: 10px; }
.note .meta .acts { display: flex; gap: 4px; }
.note .rev { color: var(--note-accent); cursor: help; }
.note textarea { border-color: var(--note-line); min-height: 56px; }
.sugg {
  background: var(--sugg-bg); border: 1px solid var(--sugg-line); border-left: 3px solid var(--llm);
  border-radius: 5px; padding: 7px 9px; margin-bottom: 7px; font-size: 12px;
}
.sugg .row { margin-bottom: 0; }
.sugg .meta { font-size: 10px; color: var(--faint); margin-top: 4px; }
textarea {
  width: 100%; background: var(--panel2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 5px; padding: 7px;
  font: inherit; resize: vertical; min-height: 64px;
}
.empty { color: var(--faint); font-size: 11.5px; font-style: italic; padding: 5px 0; }

/* ---- labels ---- */
.lbl {
  display: flex; align-items: center; gap: 4px; padding: 3px 0;
  border-bottom: 1px solid var(--line2);
}
.lbl .n { width: 14px; color: var(--faint); font-family: var(--mono); font-size: 10.5px; }
.lbl .nm { flex: 1; font-size: 12px; }
.lbl button { padding: 0 8px; font-size: 11px; background: none; color: var(--faint); }
.lbl button.pass.on { background: var(--pass-bg); border-color: var(--pass-line); color: var(--ink); }
.lbl button.fail.on { background: var(--fail-bg); border-color: var(--fail-line); color: var(--ink); }

/* ---- tables ---- */
table.grid { border-collapse: collapse; width: 100%; font-size: 11.5px; }
table.grid th, table.grid td {
  border: 1px solid var(--line); padding: 4px 7px; text-align: left;
}
table.grid th { background: var(--panel2); font-size: 10px;
  text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
table.grid td.c { text-align: center; font-family: var(--mono); }
td.F { color: var(--fail); font-weight: 600; }
td.P { color: var(--pass); }
tr.cur td { background: var(--cur-row); }
.bar { height: 6px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--asst); }

/* ---- labeling view ----
   One matrix, trace rows by mode columns. Only a Fail is marked; a Pass is an
   empty cell and an unjudged cell a faint dot, so the pattern of failures is
   what the eye lands on. Mode names run vertically so nine of them fit
   without scrolling sideways. */
.labsum { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; }
.labsum .stat { display: flex; align-items: center; gap: 8px; }
.labsum .stat .k { color: var(--faint); }
.labsum .stat .v { font-family: var(--mono); }
.labsum .bar { width: 160px; }
.labsum .bad { color: var(--err); }
.labsum label { display: inline-flex; gap: 5px; align-items: center; color: var(--dim); }
details.batches { margin-bottom: 10px; font-size: 12px; }
details.batches > summary { cursor: pointer; color: var(--dim); }
details.batches table.grid { width: auto; min-width: 420px; margin-top: 6px; }
details.batches details > summary { cursor: pointer; }
.pooldims { color: var(--dim); font-size: 11.5px; margin-top: 6px; }
table.lg { width: auto; }
table.lg th { position: sticky; top: -10px; z-index: 2; vertical-align: bottom; padding: 6px 4px; }
table.lg th.mcol { text-transform: none; letter-spacing: 0; font-weight: 500; }
table.lg th .vh {
  writing-mode: vertical-rl; transform: rotate(180deg); max-height: 150px;
  margin: 0 auto; font-family: var(--mono); font-size: 11px; color: var(--ink2);
  text-align: left;
}
table.lg th.short .vh { color: var(--err); }
table.lg th .cnt { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-top: 4px; text-align: center; }
table.lg th .cnt b { color: var(--fail); font-weight: 600; }
table.lg td, table.lg th { border-color: var(--line2); }
table.lg td:first-child, table.lg th:first-child {
  position: sticky; left: 0; background: var(--panel); z-index: 1; white-space: nowrap;
}
table.lg th:first-child { z-index: 3; background: var(--panel2); }
table.lg tr.cur td:first-child { background: var(--cur-row); }
table.lg td.m { width: 34px; min-width: 34px; padding: 0; text-align: center; }
table.lg td.m.F { background: var(--fail-bg); }
table.lg td.m.F::after { content: "F"; font-family: var(--mono); font-size: 11px; color: var(--fail); }
table.lg td.m.none::after { content: "·"; color: var(--ghost); }
table.lg td.role { color: var(--dim); font-size: 11px; }
table.lg td.t { color: var(--faint); font-family: var(--mono); font-size: 10.5px; }
table.lg tbody tr { cursor: pointer; }
table.lg tbody tr:hover td { background: var(--hover); }

/* ---- rendered markdown ---- */
.md > *:first-child { margin-top: 0; }
.md > *:last-child { margin-bottom: 0; }
.md p { margin: 0 0 7px; }
.md ul, .md ol { margin: 4px 0 7px; padding-left: 20px; }
.md li { margin: 1px 0; }
.md strong { color: var(--strong); font-weight: 600; }
.md em { color: var(--ink2); }
/* The agent emits GFM tables for product search results, where the reply has
   to be read against what the tool returned. Rendered flat they were a run-on
   paragraph of pipes. */
.md table.tbl { border-collapse: collapse; margin: 7px 0; font-size: 11.5px; }
.md table.tbl th, .md table.tbl td {
  border: 1px solid var(--line); padding: 2px 7px; vertical-align: top;
}
.md table.tbl th {
  background: var(--panel2); color: var(--dim); font-weight: 600;
  font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
}
.md code {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 3px;
  padding: 0 4px; font-size: 11.5px; color: var(--code-ink);
}
.md h3, .md h4, .md h5, .md h6 {
  margin: 8px 0 4px; font-size: 12.5px; color: var(--strong);
  text-transform: none; letter-spacing: 0; font-weight: 600;
}
.md a { color: var(--user); }
.md table { border-collapse: collapse; margin: 5px 0; }
.md td, .md th { border: 1px solid var(--line); padding: 2px 6px; }

/* ---- selection highlights ---- */
.hl {
  background: rgba(217, 164, 65, .26); border-bottom: 1px solid var(--note-accent);
  border-radius: 2px; cursor: pointer;
}
.hl:hover { background: rgba(217, 164, 65, .42); }
.hl.sugg { background: rgba(192, 140, 224, .22); border-bottom-color: var(--llm); }
.hl.pending {
  background: rgba(110, 168, 254, .34); border-bottom: 1px solid var(--user);
}
.annotatable::selection, .annotatable ::selection { background: var(--selection); }
.annotatable { cursor: text; }

#popover {
  position: absolute; z-index: 60; display: none; width: 330px;
  background: var(--panel); border: 1px solid var(--on-line); border-radius: 7px;
  padding: 9px; box-shadow: var(--shadow);
}
#popover .q {
  font-size: 11px; color: var(--dim); font-style: italic;
  margin-bottom: 6px; max-height: 52px; overflow: hidden;
  border-left: 2px solid var(--note-accent); padding-left: 6px;
}
#popover textarea { min-height: 54px; }
#popover .row { justify-content: flex-end; margin-bottom: 0; }

/* ---- taxonomy authoring ----
   Each mode is a collapsed row until opened: name, counts, status, and the
   first line of its definition. The open codes it was built from are one
   line each, with the quoted evidence in the hover text. */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.toolbar input { max-width: 320px; flex: 1; }
.toolbar .count { color: var(--faint); font-size: 11.5px; }
details.mode { border: 1px solid var(--line); border-radius: 7px; margin-bottom: 6px; background: var(--panel); }
details.mode > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; min-width: 0;
}
details.mode > summary::-webkit-details-marker { display: none; }
details.mode > summary::before { content: "▸"; color: var(--faint); font-size: 10px; }
details.mode[open] > summary::before { content: "▾"; }
details.mode[open] > summary { border-bottom: 1px solid var(--line); background: var(--panel2); border-radius: 7px 7px 0 0; }
.mode .mn { font-family: var(--mono); font-weight: 600; color: var(--asst); white-space: nowrap; }
.mode .mdef { flex: 1; min-width: 0; color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode .mcnt { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
.mode .mcnt b { color: var(--fail); font-weight: 600; }
.src.gap { color: var(--err); border-color: var(--warn-line); }
.src.ok { color: var(--pass); border-color: var(--pass-line); }
.mbody { padding: 9px 11px; }
.mbody label {
  display: block; margin-bottom: 8px;
  font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint);
}
.mbody textarea, .mbody > label > input, .mbody .mrow label > input, .mbody select {
  display: block; width: 100%; margin-top: 3px;
  background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 5px; padding: 5px 7px;
  font: 12.5px/1.45 system-ui, sans-serif; text-transform: none; letter-spacing: 0;
}
.mbody textarea { min-height: 42px; resize: vertical; }
.mbody input.mono { font-family: var(--mono); font-size: 11.5px; }
.mbody .chips { margin-top: 3px; text-transform: none; letter-spacing: 0; }
.mrow { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0 12px; }
.mfoot { display: flex; justify-content: flex-end; margin-top: 6px; }
.codes { border-top: 1px solid var(--line2); }
.code {
  display: flex; align-items: baseline; gap: 8px; padding: 3px 2px;
  border-bottom: 1px solid var(--line2); font-size: 12px;
}
.code .ct { flex: 1; min-width: 0; }
.code .ct[title] { cursor: help; }
.code .cs { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; cursor: pointer; }
.code .cs:hover { color: var(--user); }
.code button { padding: 0 6px; font-size: 11px; }
.code select { font-size: 11px; padding: 1px 4px; }
.grp {
  font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--faint); margin: 10px 0 4px; font-weight: 600;
}

/* ---- map ----
   A port of the static trace map (analysis/trace_map/ui), scoped under #tm so
   its class names cannot collide with the review view's. Highlight slots are
   the dataviz reference's first three dark categorical steps: a scatter
   cannot give 15 clusters 15 hues, so clusters carry a number above them and
   only the (at most three) clusters you pick get a color. "Color: review"
   swaps that for review coverage, the question Part B asks of this view. */
#tm {
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --point: #7d8598; --m-reviewed: #3987e5; --m-sampled: #d95926;
  padding: 0; overflow: hidden; height: 100%;
}
#tm.active { display: grid; grid-template-columns: 290px 1fr 420px; min-height: 0; }
#tm .tmcol { overflow-y: auto; padding: 10px 12px; min-height: 0; background: var(--panel); }
#tm .tmleft { border-right: 1px solid var(--line); }
#tm .tmright { border-left: 1px solid var(--line); }
#tm .muted { color: var(--dim); }
#tm .faint { color: var(--faint); }
#tm .small { font-size: 11px; }
#tm h4 .aside { text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 400; }
#tm .runmeta { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
#tm .pill.live { color: var(--tool); border-color: var(--off-line); }
#tm #tm-search {
  width: 100%; margin-bottom: 10px; font: inherit; color: var(--ink); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px;
}
#tm #tm-search::placeholder { color: var(--faint); }
/* cluster list */
#tm .cl {
  display: grid; grid-template-columns: 14px 26px 1fr auto; gap: 6px; align-items: start;
  padding: 5px 6px; border-radius: 5px; cursor: pointer; border: 1px solid transparent;
}
#tm .cl:hover { background: var(--panel2); }
#tm .cl.on { border-color: var(--line); background: var(--panel2); }
#tm .cl .sw { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--point); }
#tm .cl .sw.ring { background: transparent; border: 1.5px solid var(--point); }
#tm .cl .num { font-family: var(--mono); color: var(--dim); font-size: 12px; }
#tm .cl .lab { font-size: 12px; overflow-wrap: anywhere; }
#tm .cl .cov { display: block; color: var(--faint); font-size: 10.5px; font-variant-numeric: tabular-nums; margin-top: 1px; }
#tm .cl .n { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
/* map */
#tm .mapwrap { position: relative; min-width: 0; min-height: 0; }
#tm canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#tm canvas.drag { cursor: grabbing; }
#tm .maptools { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#tm .maptools label { display: inline-flex; align-items: center; gap: 4px; }
#tm .maptools .kinds { display: flex; gap: 8px; margin-left: 6px; padding-left: 8px; border-left: 1px solid var(--line); flex-wrap: wrap; }
#tm #tm-mode { font: inherit; font-size: 12px; color: var(--ink); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; max-width: 260px; }
#tm .cl .cov .f { color: var(--fail); }
#tm .pill.fail { color: var(--fail); border-color: var(--warn-line); }
#tm .legend {
  position: absolute; bottom: 8px; left: 8px; display: flex; gap: 12px; flex-wrap: wrap;
  background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 9px; font-size: 11px; color: var(--dim); max-width: calc(100% - 16px);
}
#tm .legend span { display: inline-flex; align-items: center; gap: 5px; }
#tm .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
#tm .legend i.ring { border: 1.5px solid var(--point); }
#tm .legend i.cur { border: 1.2px dashed var(--ink); }
#tm #tm-tip {
  position: absolute; pointer-events: none; display: none; max-width: 320px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); z-index: 3;
}
#tm #tm-tip .t { font-weight: 600; margin-bottom: 2px; }
#tm .empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--dim); text-align: center; padding: 30px;
}
/* display:flex above would otherwise beat [hidden] and leave an invisible
   layer over the canvas that swallows every click and hover. */
#tm .empty[hidden] { display: none; }
/* reference items */
#tm .shape { display: inline-block; width: 10px; height: 10px; vertical-align: -1px; }
#tm .reftext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--ink);
  background: var(--panel2); border-radius: 6px; padding: 8px 10px; max-height: 320px; overflow-y: auto; }
#tm .reflist a { display: grid; grid-template-columns: 28px 1fr auto; gap: 6px; align-items: baseline;
  color: var(--ink); text-decoration: none; font-size: 12px; padding: 3px 5px; border-radius: 4px; }
#tm .reflist a:hover { background: var(--panel2); }
#tm .reflist .score { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
/* cluster pane */
#tm .pills { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
#tm .pill.link { cursor: pointer; color: var(--ink); }
#tm .pill.link:hover { border-color: var(--dim); }
#tm .bars { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 3px 8px; align-items: center; margin: 2px 0 8px; }
#tm .bars .k { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
#tm .bars .track { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
#tm .bars .fill { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--point); }
#tm .bars .v { font-size: 11px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
/* Cluster share as a bar, all-trace share as a tick on the same track. */
#tm .cmp { display: grid; grid-template-columns: minmax(0, 1fr) 110px 36px 36px; gap: 3px 8px; align-items: center; margin: 2px 0 8px; }
#tm .cmp .hd { font-size: 10px; color: var(--faint); text-align: right; }
#tm .cmp .k { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
#tm .cmp .k .dir { display: inline-block; width: 12px; color: var(--dim); font-family: system-ui, sans-serif; }
#tm .cmp .track { position: relative; height: 10px; background: var(--panel2); border-radius: 4px; }
#tm .cmp .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--point); }
#tm .cmp .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
#tm .cmp .v { font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
#tm .cmp .v.all { color: var(--dim); }
#tm .cmpkey { display: flex; gap: 12px; font-size: 11px; color: var(--dim); margin: 0 0 4px; }
#tm .cmpkey i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; background: var(--point); vertical-align: 0; margin-right: 4px; }
#tm .cmpkey b { display: inline-block; width: 2px; height: 12px; background: var(--ink); vertical-align: -2px; margin-right: 5px; }
#tm .memberlist a { display: block; color: var(--ink); text-decoration: none; font-size: 12px; padding: 3px 5px; border-radius: 4px; }
#tm .memberlist a:hover { background: var(--panel2); }
#tm .memberlist a .rep { color: var(--tool); font-size: 10px; margin-right: 5px; }
#tm .memberlist a .st { font-size: 10px; margin-right: 5px; }
#tm .memberlist a .g { display: block; color: var(--dim); font-size: 11px; }
/* detail */
#tm .title { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
#tm .kv { margin: 0 0 6px; }
#tm ul.tight { margin: 2px 0 6px; padding-left: 18px; }
#tm ul.tight li { margin: 1px 0; }
#tm .tool { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
#tm .tool .arrow { color: var(--faint); }
#tm .turnsep { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px;
  color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
#tm .turnsep::before, #tm .turnsep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
#tm .tstep { margin: 0 0 6px; padding: 6px 9px 6px 11px; background: var(--panel2);
  border-radius: 6px; border-left: 3px solid var(--line); }
#tm .tstep.prior { opacity: .55; }
#tm .tstep.user { border-left-color: var(--user); }
#tm .tstep.assistant { border-left-color: var(--asst); }
#tm .tstep.tool_call, #tm .tstep.tool_result { border-left-color: var(--tool); }
#tm .tstep.bad { border-left-color: var(--err); }
#tm .tstep .who { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
#tm .tstep .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
#tm .tstep pre { margin: 3px 0 0; font-family: var(--mono); font-size: 11px; white-space: pre-wrap;
  overflow-wrap: anywhere; color: var(--dim); max-height: 260px; overflow-y: auto; }
#tm .tstep details summary { cursor: pointer; color: var(--dim); font-size: 12px; }
#tm .note { font-size: 11px; color: var(--faint); border-top: 1px solid var(--line); margin-top: 16px; padding-top: 8px; }
#tm .openrev { margin: 2px 0 10px; }
@media (max-width: 1100px) {
  #tm.active { grid-template-columns: 240px 1fr; overflow: auto; }
  #tm .tmright { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
  #tm .mapwrap { height: 60vh; }
}

/* ---- shortcut help ---- */
#help {
  position: fixed; inset: 0; z-index: 90; display: none;
  background: var(--overlay); align-items: center; justify-content: center;
}
#help.open { display: flex; }
#help .card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px 22px; max-width: 620px; width: calc(100% - 40px);
  max-height: 84vh; overflow-y: auto; box-shadow: var(--shadow);
}
#help h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
#help .row { align-items: baseline; gap: 2px 11px; padding: 2.5px 0; margin: 0; flex-wrap: wrap; }
#help .row .desc { flex: 1; font-size: 12.5px; }
#help .row .tip { color: var(--faint); font-size: 11px; flex-basis: 100%; padding-left: 44px; }
kbd {
  font-family: var(--mono); font-size: 11px; min-width: 22px; text-align: center;
  background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 6px; display: inline-block; color: var(--ink);
}
#help .modes {
  margin: 5px 0 0 0; font-size: 11px; color: var(--dim);
  border-left: 2px solid var(--line); padding-left: 8px;
}
#help .modes code { color: var(--asst); }

#toast {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--toast-bg); color: var(--toast-ink); border-radius: 6px;
  padding: 7px 14px; opacity: 0; transition: opacity .2s; pointer-events: none;
  font-size: 12px; z-index: 50;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="tabs">
    <button id="tab-review" class="on">Review</button>
    <button id="tab-tax">Taxonomy</button>
    <button id="tab-label">Labeling</button>
    <button id="tab-map">Map</button>
  </div>
  <div class="grow"></div>
  <!-- Trace navigation, shown only on the views it drives (Review, Labeling). -->
  <div id="nav">
    <button id="prev" title="previous trace (k)">&larr;</button>
    <span id="pos" class="id">0 / 0</span>
    <button id="next" title="next trace (j)">&rarr;</button>
    <select id="filter">
      <!-- Sample scope, filled from the manifest by fillScopeFilter(). Batches 4
           and 5 are drawn only after the taxonomy exists, so the batch options
           cannot be written here; they have to appear as soon as a batch does. -->
      <optgroup id="filter-scope" label="scope"></optgroup>
      <optgroup label="review state">
      <option value="unreviewed">unreviewed</option>
      <option value="reviewed">reviewed</option>
      <option value="unlabeled">incomplete labels</option>
      </optgroup>
      <optgroup label="trace properties">
      <option value="shopper">role: shopper</option>
      <option value="merchant">role: merchant</option>
      <option value="support">role: support</option>
      <option value="challenge">group: challenge</option>
      <option value="coverage">group: coverage</option>
      <option value="write">wrote something</option>
      <option value="toolerr">tool error</option>
      <option value="denied">permission denied</option>
      <option value="dq">injected data defect</option>
      </optgroup>
    </select>
  </div>
  <button id="themebtn" title="theme: auto, light, dark"></button>
  <button id="helpbtn" title="keyboard shortcuts (?)">?</button>
</header>

<main id="main">
  <!-- ============ REVIEW ============ -->
  <div class="col left view active" data-view="review">
    <details class="sec" id="sec-scen" open>
      <summary>Scenario</summary>
      <div id="scen"></div>
    </details>
    <details class="sec" id="sec-facts" open>
      <summary>Evidence</summary>
      <div id="facts"></div>
    </details>
    <details class="sec" id="sec-spec" open>
      <summary>Specification</summary>
      <div id="spec"></div>
    </details>
  </div>

  <div class="col mid view active" data-view="review">
    <div class="tracebar">
      <span id="hdr-meta" class="id"></span>
      <span id="hdr-pills"></span>
      <span class="grow"></span>
      <button id="toolbtn" title="tool and interim-message detail: compact, full, off (t)">tools: compact</button>
    </div>
    <div id="convo"></div>
  </div>

  <!-- Open coding and structured labeling are separate passes, so the panel
       shows one at a time. -->
  <div class="col right view active" data-view="review">
    <div class="seg paneseg">
      <button id="pane-code-btn" title="open code (o)">Open code<span id="code-cnt" class="cnt"></span></button>
      <button id="pane-label-btn" title="labels (l)">Labels<span id="label-cnt" class="cnt"></span></button>
    </div>
    <div class="pane" id="pane-code">
      <textarea id="note-in" placeholder="Open code"></textarea>
      <div class="row">
        <button id="note-save">Save note</button>
        <button id="note-clean">No failure observed</button>
      </div>
      <div id="notes"></div>
      <div id="suggs-block" hidden>
        <h4>AI suggestions</h4>
        <div id="suggs"></div>
      </div>
    </div>
    <div class="pane" id="pane-label" hidden>
      <div id="labels"></div>
    </div>
  </div>

  <!-- ============ TAXONOMY ============ -->
  <div class="col view" data-view="tax" style="grid-column:1/-1">
    <datalist id="req-ids"></datalist>
    <div class="toolbar">
      <input id="new-mode-name" placeholder="new mode name">
      <button id="new-mode">+ add mode</button>
      <span id="tax-count" class="count"></span>
    </div>
    <div id="tax"></div>
    <h4>Ungrouped open codes</h4>
    <div id="ungrouped"></div>
  </div>

  <!-- ============ LABELING ============ -->
  <div class="col view" data-view="label" style="grid-column:1/-1">
    <div id="labsum"></div>
    <div id="lblgrid"></div>
  </div>

  <!-- ============ MAP ============ -->
  <div class="view" data-view="map" id="tm" style="grid-column:1/-1">
    <section class="tmcol tmleft">
      <div class="runmeta" id="tm-runmeta"></div>
      <input id="tm-search" type="search" placeholder="Search titles, goals, tools">
      <h4>Clusters</h4>
      <div id="tm-clusters"></div>
    </section>
    <section class="mapwrap" id="tm-wrap">
      <canvas id="tm-map" aria-label="Scatter plot of traces by embedded summary"></canvas>
      <div class="maptools">
        <button id="tm-reset" title="Reset zoom (0)">Reset view</button>
        <button id="tm-clear" title="Clear highlights (Esc)">Clear</button>
        <span class="seg" title="What point color shows">
          <button id="tm-by-cluster" class="on">Color: clusters</button><button id="tm-by-review">review</button><button id="tm-by-mode">mode</button>
        </span>
        <select id="tm-mode" title="Failure mode to color by" hidden></select>
        <label class="small muted"><input type="checkbox" id="tm-numbers"> all numbers</label>
        <span class="kinds small muted" id="tm-kinds"></span>
      </div>
      <div class="legend" id="tm-legend"></div>
      <div id="tm-tip"></div>
      <div class="empty" id="tm-empty" hidden></div>
    </section>
    <section class="tmcol tmright" id="tm-detail">
      <p class="muted">Select a point or cluster.</p>
    </section>
  </div>
</main>

<div id="help"><div class="card">
  <h3>Keyboard shortcuts</h3>
  <div id="help-body"></div>
</div></div>

<div id="popover">
  <div class="q" id="pop-quote"></div>
  <textarea id="pop-note" placeholder="Open code"></textarea>
  <div class="row">
    <button id="pop-cancel">cancel</button>
    <button id="pop-save">save</button>
  </div>
</div>

<div id="toast"></div>
<script>
"use strict";

const S = {
  pool: [], spec: {}, ann: [], modes: [], suggs: [], labels: {},
  idx: 0, filter: "sample", view: "review", byId: {}, keepScroll: null,
  // Which pass the right panel shows: "code" (open coding) or "label"
  // (structured labeling). They are separate passes, so only one is on screen.
  pane: pref("pane", "code"),
  // Taxonomy cards the reviewer has opened, by mode name. Held here because
  // polling re-renders the list, which would otherwise close them every tick.
  taxOpen: new Set(),
  // Labeling grid: show only traces with at least one Fail.
  failOnly: false,
  // The sampling design from analysis/state/sample_manifest.json, and the
  // trace_id -> batch name map derived from it. The map is single valued
  // because sample_batches.py asserts no trace is drawn into two batches.
  // Default filter is "sample": the pool holds 267 traces, the review set is
  // the manifest's batches, and opening on the pool invites reviewing traces
  // that count toward nothing.
  manifest: { batches: [] }, batchOf: {},
  // How much tool activity the conversation shows: "compact" (calls on one
  // line, results as a verdict line), "full" (arguments and result JSON
  // expanded), "off" (tool steps hidden). Interim assistant messages (before
  // a turn's final reply, never shown to the user) follow the same level.
  // Deliberately not persisted: this
  // interface exists because the stock Langfuse view separated tool calls from
  // replies, so "off" has to be a mode you chose just now, not one you are
  // still in tomorrow without remembering why.
  tools: "compact",
  // Annotation id of the open code currently being reworded, or null.
  editing: null,
  // The map data (the trace map build, else the clustering run), fetched when
  // the Map tab first opens. It only changes on a rebuild, so it is not polled.
  graph: null,
  // Live polling. `writes` counts POSTs this tab has started; a poll whose
  // responses arrive after a write began is discarded, because it may carry
  // the file as it was before that write and would roll the local edit back.
  // `stale` records polled changes held back while the reviewer was mid-edit.
  sig: {}, writes: 0, inflight: 0, stale: false,
};
const TOOL_LEVELS = ["compact", "full", "off"];

// Per-browser conveniences (theme, which pane, which sections are open).
// Storage can be missing or throw in a private window, so every access is
// guarded and the app works the same without it.
function pref(k, dflt) {
  try { return localStorage.getItem("review." + k) ?? dflt; } catch (e) { return dflt; }
}
function setPref(k, v) {
  try { localStorage.setItem("review." + k, v); } catch (e) { /* not persisted */ }
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clip = (s, n) => (s.length > n ? s.slice(0, n) + "…" : s);

// ---------------------------------------------------------------- markdown
// The agent writes Markdown (bold order numbers, bulleted order details,
// numbered candidate lists). Shown raw, the asterisks and dashes compete with
// the content for attention, which is the opposite of what open coding needs.
// This is a deliberately small renderer covering what the agent actually
// emits; everything is escaped first, so trace text can never inject HTML.
function inline(s) {
  return s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// ---- GFM tables
// Splits a row into cells, tolerating the optional leading and trailing pipe.
function tblCells(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|")) s = s.slice(0, -1);
  return s.split("|").map((c) => c.trim());
}

// The alignment row, or null when this is not one. Colons set the alignment,
// which the agent does use: prices and ids come back right aligned.
function tblAligns(line) {
  if (!line || line.indexOf("|") < 0) return null;
  const aligns = [];
  for (const c of tblCells(line)) {
    const m = /^(:?)-+(:?)$/.exec(c);
    if (!m) return null;
    aligns.push(m[1] && m[2] ? "center" : m[2] ? "right" : m[1] ? "left" : "");
  }
  return aligns.length ? aligns : null;
}

function tblHTML(header, aligns, rows) {
  const sty = (j) => (aligns[j] ? ` style="text-align:${aligns[j]}"` : "");
  const head = header.map((c, j) => `<th${sty(j)}>${inline(c)}</th>`).join("");
  const body = rows.map((r) => {
    // A ragged row is padded, and any overflow is folded into the last cell
    // rather than dropped. A malformed table in a trace under review may be
    // the evidence; discarding cells would hide it.
    const cells = [];
    for (let j = 0; j < header.length; j++) {
      const v = j === header.length - 1 && r.length > header.length
        ? r.slice(j).join(" | ") : (r[j] ?? "");
      cells.push(`<td${sty(j)}>${inline(v)}</td>`);
    }
    return `<tr>${cells.join("")}</tr>`;
  }).join("");
  return `<table class="tbl"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

function md(src) {
  const lines = esc(String(src ?? "")).replace(/\r/g, "").split("\n");
  const out = [];
  let para = [];
  let list = null; // linked list of open {tag, indent, prev}
  const flushPara = () => {
    if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; }
  };
  const closeLists = () => {
    while (list) { out.push(`</${list.tag}>`); list = list.prev; }
  };

  // Indexed rather than for-of: a table is recognised by looking at the line
  // after the header, which needs one line of lookahead.
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/\s+$/, "");
    if (!line.trim()) { flushPara(); closeLists(); continue; }

    if (line.indexOf("|") >= 0 && i + 1 < lines.length) {
      const aligns = tblAligns(lines[i + 1]);
      const header = tblCells(line);
      if (aligns && aligns.length === header.length) {
        flushPara(); closeLists();
        const rows = [];
        let j = i + 2;
        while (j < lines.length && lines[j].indexOf("|") >= 0 && lines[j].trim()) {
          rows.push(tblCells(lines[j]));
          j++;
        }
        out.push(tblHTML(header, aligns, rows));
        i = j - 1; // the loop's own increment lands on the first line after
        continue;
      }
    }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      flushPara(); closeLists();
      const lvl = Math.min(6, h[1].length + 2);
      out.push(`<h${lvl}>${inline(h[2])}</h${lvl}>`);
      continue;
    }

    const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
    if (li) {
      flushPara();
      const indent = li[1].length;
      const tag = /\d/.test(li[2]) ? "ol" : "ul";
      if (!list) { out.push(`<${tag}>`); list = { tag, indent, prev: null }; }
      else if (indent > list.indent) { out.push(`<${tag}>`); list = { tag, indent, prev: list }; }
      else {
        while (list.prev && indent < list.indent) { out.push(`</${list.tag}>`); list = list.prev; }
      }
      out.push(`<li>${inline(li[3])}</li>`);
      continue;
    }

    closeLists();
    para.push(line.trim());
  }
  flushPara(); closeLists();
  return out.join("");
}

// ---------------------------------------------------------------- highlights
// Anchoring is by quote text within a block, the same scheme the reference
// interface uses. Character offsets into the DOM would break the moment the
// block re-renders; a quote match survives it, and survives Markdown rendering
// too because the quote is captured from the rendered text the reviewer saw.
function markQuote(root, quote, cls, id) {
  if (!quote || !root) return false;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let full = "", node;
  while ((node = walker.nextNode())) {
    if (node.parentElement.closest(".hl")) continue; // already marked
    nodes.push({ node, start: full.length });
    full += node.nodeValue;
  }
  const pos = full.indexOf(quote);
  if (pos < 0) return false;
  const end = pos + quote.length;
  // Walk backwards so wrapping one segment cannot shift the offsets of the
  // segments still to be wrapped. A quote spanning a <strong> lands in two or
  // more text nodes, each wrapped separately but visually contiguous.
  for (let i = nodes.length - 1; i >= 0; i--) {
    const { node: n, start } = nodes[i];
    const nEnd = start + n.nodeValue.length;
    if (nEnd <= pos || start >= end) continue;
    const range = document.createRange();
    range.setStart(n, Math.max(0, pos - start));
    range.setEnd(n, Math.min(n.nodeValue.length, end - start));
    const span = document.createElement("span");
    span.className = cls;
    if (id) span.dataset.item = id;
    try { range.surroundContents(span); } catch (e) { /* crosses a boundary */ }
  }
  return true;
}

function applyHighlights(t) {
  notesFor(t.trace_id).forEach((a, i) => {
    if (!a.quote) return;
    const block = $("#convo").querySelector(`[data-key="${a.anchor}"] .annotatable`);
    if (block) markQuote(block, a.quote, "hl", "n" + i);
  });
  S.suggs.filter((s) => s.trace_id === t.trace_id && s.quote && !s.verdict)
    .forEach((s, i) => {
      const block = $("#convo").querySelector(`[data-key="${s.anchor}"] .annotatable`);
      if (block) markQuote(block, s.quote, "hl sugg", "g" + i);
    });
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1900);
}

async function api(path, body) {
  const write = body !== undefined;
  const opt = !write ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  };
  if (write) { S.writes++; S.inflight++; }
  try {
    const r = await fetch(path, opt);
    if (!r.ok) {
      let msg = r.statusText;
      try { msg = (await r.json()).error || msg; } catch (e) { /* keep statusText */ }
      throw new Error(msg);
    }
    return await r.json();
  } finally {
    if (write) S.inflight--;
  }
}

// ---------------------------------------------------------------- load
async function load() {
  const [pool, spec, ann, pat, suggs, labels, manifest] = await Promise.all([
    api("/api/pool"), api("/api/spec"), api("/api/annotations"),
    api("/api/patterns"), api("/api/suggestions"), api("/api/labels"),
    api("/api/manifest"),
  ]);
  S.pool = pool;
  S.spec = spec;
  applyLive({ ann, pat, suggs, labels, manifest });
  S.pool.forEach((t) => { S.byId[t.trace_id] = t; });
  $("#sec-spec > summary").title = "SPEC.md sha " + (spec.digest || "?").slice(0, 8);
  // Autocomplete for a mode's requirement source, so the id is picked from
  // SPEC.md rather than typed from memory.
  $("#req-ids").innerHTML = Object.keys(spec.requirements || {})
    .sort().map((id) => `<option value="${esc(id)}">`).join("");
  render();
}

// ---------------------------------------------------------------- live polling
// The state files an agent writes while you review: a draft taxonomy
// (patterns), depth-search suggestions, a newly drawn batch (manifest), and
// labels or notes from another tab. The pool is 2 MB and fixed, so it is not
// polled.
const LIVE = [
  ["ann", "/api/annotations"], ["pat", "/api/patterns"],
  ["suggs", "/api/suggestions"], ["labels", "/api/labels"],
  ["manifest", "/api/manifest"],
];
const POLL_MS = 2000;

function applyLive(d) {
  if ("ann" in d) S.ann = (d.ann && d.ann.annotations) || [];
  if ("pat" in d) S.modes = (d.pat && d.pat.modes) || [];
  if ("suggs" in d) S.suggs = Array.isArray(d.suggs) ? d.suggs : [];
  if ("labels" in d) S.labels = d.labels || {};
  if ("manifest" in d) {
    const m = d.manifest;
    S.manifest = m && Array.isArray(m.batches) ? m : { batches: [] };
    S.batchOf = {};
    S.manifest.batches.forEach((b) => {
      // Worklist batches may repeat traces from earlier batches. The first
      // batch to list a trace keeps it, so no trace counts toward two batches.
      (b.picks || []).forEach((p) => { S.batchOf[p.trace_id] ??= b.name; });
    });
    fillScopeFilter();
  }
  Object.entries(d).forEach(([k, v]) => { S.sig[k] = JSON.stringify(v); });
}

// True while re-rendering would destroy something the reviewer is doing. The
// open popover, a note being reworded, a taxonomy field with focus, and a
// half-made text selection all live in DOM that render() replaces. Their
// handlers also hold the objects they will mutate, so the polled data is not
// even applied until the reviewer is done; the next tick picks it up.
function busy() {
  if ($("#popover").style.display === "block" || S.editing) return true;
  const a = document.activeElement;
  // Form fields only: a clicked button keeps focus in some browsers and would
  // otherwise hold polling off until the reviewer happened to click elsewhere.
  if (a && a.matches && a.matches("input, textarea, select") &&
      a.closest("#tax, #ungrouped, #notes")) return true;
  const sel = window.getSelection();
  return !!(sel && !sel.isCollapsed && $("#convo").contains(sel.anchorNode));
}

async function poll() {
  if (document.hidden || S.inflight) return;
  const seq = S.writes;
  let res;
  try { res = await Promise.all(LIVE.map(([, path]) => api(path))); }
  catch (e) { return; } // server restarting; the next tick retries
  if (seq !== S.writes || S.inflight) return;

  const d = {};
  LIVE.forEach(([k], i) => {
    if (JSON.stringify(res[i]) !== S.sig[k]) d[k] = res[i];
  });
  if (!Object.keys(d).length || busy()) return;

  const pending = () => S.suggs.filter((s) => !s.verdict).length;
  const before = { sugg: pending(), batches: S.manifest.batches.length, modes: S.modes.length };
  const keep = (cur() || {}).trace_id;
  applyLive(d);

  const news = [];
  if (S.manifest.batches.length > before.batches) news.push("new batch drawn");
  if (pending() > before.sugg) news.push(`${pending() - before.sugg} new suggestion(s)`);
  if (S.modes.length !== before.modes) news.push(`taxonomy now ${S.modes.length} modes`);
  if (news.length) toast(news.join(" · "));

  // Stay on the trace being read. A new batch reorders the sample, so the
  // old index would silently point at a different trace.
  if (keep) {
    const i = visible().findIndex((t) => t.trace_id === keep);
    if (i >= 0) S.idx = i;
  }
  if (S.view === "review") S.keepScroll = $("#convo").scrollTop;
  render();
}

// ---------------------------------------------------------------- selection
function inSample(t) { return !!S.batchOf[t.trace_id]; }
function sampleSize() { return S.pool.filter(inSample).length; }

// Builds the scope group of the filter from the manifest on every load, so a
// batch drawn later shows up without editing this file.
function fillScopeFilter() {
  const n = sampleSize();
  const opts = [`<option value="sample">in sample (${n})</option>`];
  S.manifest.batches.forEach((b) => {
    opts.push(`<option value="batch:${esc(b.name)}">&nbsp;&nbsp;${
      esc(b.name)} (${(b.picks || []).length})</option>`);
  });
  opts.push(`<option value="offsample">off-manifest (${S.pool.length - n})</option>`);
  opts.push(`<option value="all">all traces (${S.pool.length})</option>`);
  $("#filter-scope").innerHTML = opts.join("");
  // With no manifest, "in sample" would select nothing, which reads as a
  // broken app rather than an undrawn sample.
  if (!n && S.filter === "sample") S.filter = "all";
  $("#filter").value = S.filter;
}

function visible() {
  const f = S.filter;
  // Scope is answered before the property filters. "Is this trace part of the
  // review set" is a different question from "what happened in it", and only
  // the first one decides whether reading it counts toward the 100.
  if (f === "sample") return S.pool.filter(inSample);
  if (f === "offsample") return S.pool.filter((t) => !inSample(t));
  if (f.startsWith("batch:")) {
    const name = f.slice(6);
    // Every trace the batch lists, including ones counted in an earlier batch.
    const b = S.manifest.batches.find((x) => x.name === name);
    const ids = new Set(((b && b.picks) || []).map((p) => p.trace_id));
    return S.pool.filter((t) => ids.has(t.trace_id));
  }
  return S.pool.filter((t) => {
    const d = t.derived, sc = t.scenario || {};
    switch (f) {
      case "unreviewed": return !notesFor(t.trace_id).length;
      case "reviewed": return notesFor(t.trace_id).length > 0;
      case "unlabeled": return S.modes.length > 0 && missingLabels(t.trace_id).length > 0;
      case "shopper": case "merchant": case "support":
        return t.langfuse.user_role === f;
      case "challenge": case "coverage": return sc.scenario_group === f;
      case "write": return d.write_tools_used.length > 0;
      case "toolerr": return d.tool_errors.length > 0;
      case "denied": return d.permission_denied;
      case "dq": return !!sc.data_quality_case_id;
      default: return true;
    }
  });
}
function cur() { const v = visible(); return v[Math.min(S.idx, v.length - 1)]; }
function notesFor(id) { return S.ann.filter((a) => a.trace_id === id); }
function missingLabels(id) {
  return S.modes.filter((m) => !(S.labels[m.name] || {})[id]);
}

// ---------------------------------------------------------------- render
function render() {
  document.querySelectorAll(".view").forEach((el) => {
    el.classList.toggle("active", el.dataset.view === S.view);
  });
  $("#main").classList.toggle("wide", S.view !== "review");
  ["review", "tax", "label", "map"].forEach((v) =>
    $("#tab-" + v).classList.toggle("on", S.view === v));
  $("#nav").hidden = !(S.view === "review" || S.view === "label");
  const v = visible();
  $("#pos").textContent = v.length ? `${Math.min(S.idx, v.length - 1) + 1} / ${v.length}` : "0 / 0";

  if (S.view === "review") renderReview();
  else if (S.view === "tax") renderTax();
  else if (S.view === "label") renderGrid();
  else renderMap();
}

function renderReview() {
  const t = cur();
  renderPane();
  if (!t) {
    $("#convo").innerHTML = '<div class="empty">No traces match this filter.</div>';
    ["#scen", "#facts", "#spec", "#notes", "#suggs", "#labels"].forEach(
      (s) => ($(s).innerHTML = ""));
    $("#hdr-meta").textContent = ""; $("#hdr-pills").innerHTML = "";
    return;
  }
  renderHeader(t); renderScenario(t); renderFacts(t);
  renderSpec(t); renderConvo(t); renderNotes(t); renderSuggs(t); renderLabels(t);
}

// The pane buttons carry the other pane's state in a few characters, so the
// hidden pass is not forgotten: how many open codes, and how many Fails or
// missing judgments.
function renderPane() {
  const code = S.pane === "code";
  $("#pane-code").hidden = !code;
  $("#pane-label").hidden = code;
  $("#pane-code-btn").classList.toggle("on", code);
  $("#pane-label-btn").classList.toggle("on", !code);
  const t = cur();
  const n = t ? notesFor(t.trace_id).length : 0;
  $("#code-cnt").textContent = n ? String(n) : "";
  const lc = $("#label-cnt");
  lc.className = "cnt";
  lc.textContent = "";
  if (t && S.modes.length) {
    const miss = missingLabels(t.trace_id).length;
    const fails = S.modes.filter((m) => ((S.labels[m.name] || {})[t.trace_id] || {}).label === 1).length;
    if (miss) { lc.textContent = `${miss} left`; lc.classList.add("bad"); }
    else if (fails) lc.textContent = `${fails} F`;
  }
}

function setPane(p) {
  if (S.pane === p) return;
  S.pane = p; setPref("pane", p);
  renderPane();
}

function renderHeader(t) {
  const lf = t.langfuse, s = t.session;
  $("#hdr-meta").textContent =
    `${lf.scenario_id} · ${t.trace_id.slice(0, 10)} · turn ${s.turn_index + 1}/${s.turn_count}`;
  const p = [`<span class="pill role">${esc(lf.user_role)} #${esc(lf.user_id)}</span>`];
  // Sample provenance first, because it changes what reading this trace means:
  // an off-manifest trace is one the escape hatch reached, and its open code is
  // depth-search material rather than part of the drawn sample.
  const batch = S.batchOf[t.trace_id];
  p.push(batch
    ? `<span class="pill batch" title="drawn into this manifest batch">${esc(batch)}</span>`
    : `<span class="pill off" title="not in sample_manifest.json; does not count toward the 100">off-manifest</span>`);
  const g = (t.scenario || {}).scenario_group;
  if (g) p.push(`<span class="pill">${esc(g)}</span>`);
  if ((t.scenario || {}).data_quality_case_id)
    p.push(`<span class="pill warn">data defect</span>`);
  if (t.derived.permission_denied) p.push(`<span class="pill warn">denied</span>`);
  if (notesFor(t.trace_id).length) p.push(`<span class="pill">coded</span>`);
  $("#hdr-pills").innerHTML = p.join(" ");
  renderToolBtn(t);
}

// The button always states the level, and when steps survive "off" it says how
// many, so a visible tool step in a hidden view is explained rather than odd.
function renderToolBtn(t) {
  let label = `tools: ${S.tools}`;
  if (S.tools === "off" && t) {
    const anns = annotatedKeys(t);
    const interim = interimSteps(t.steps);
    const kept = (t.steps || []).filter((st, i) =>
      (st.role === "tool_call" || st.role === "tool_result") && anns.has("s" + i)).length;
    const hidden = [...interim].filter((i) => anns.has("s" + i)).length;
    const bits = [];
    if (kept) bits.push(`${kept} kept`);
    if (hidden) bits.push(`${hidden} noted interim hidden`);
    if (bits.length) label += ` (${bits.join(", ")})`;
  }
  $("#toolbtn").textContent = label;
}

function cycleTools() {
  S.tools = TOOL_LEVELS[(TOOL_LEVELS.indexOf(S.tools) + 1) % TOOL_LEVELS.length];
  S.keepScroll = $("#convo").scrollTop;
  render();
}

// The tuple fields that most change what the right behavior is. The rest of
// the tuple, and the trace metadata, sit behind "all fields".
const SCEN_LINE = ["intent", "record_state", "applicable_policy"];

function renderScenario(t) {
  const sc = t.scenario;
  const lf = t.langfuse;
  if (!sc) { $("#scen").innerHTML = '<div class="empty">no scenario join</div>'; return; }
  const row = (k, v, hot) =>
    `<div class="fact"><span class="k">${esc(k)}</span><span class="v${hot ? " hot" : ""}">${esc(v)}</span></div>`;
  const tup = sc.tuple || {};
  const line = SCEN_LINE.map((k) => tup[k]).filter(Boolean);
  let h = line.length
    ? `<div class="scenline">${line.map(esc).join(" · ")}</div>`
    : '<div class="empty">no scenario tuple</div>';
  if (sc.data_quality_case_id) h += row("defect", sc.data_quality_case_id, true);
  const exp = sc.expected || {};
  const detail = exp.objective || exp.human_judgment || exp.criteria || exp.notes;
  if (detail)
    h += `<div class="expected">${esc(typeof detail === "string" ? detail : JSON.stringify(detail, null, 1))}</div>`;

  // The full tuple, in the scenario file's order: each dimension is one reason
  // the expected behavior differs, so it stays one click away.
  let all = "";
  Object.entries(tup).forEach(([k, v]) => { all += row(k, v ?? "—"); });
  all += row("group", sc.scenario_group);
  if (exp.evaluation) all += row("evaluation", exp.evaluation);
  if (sc.followups && sc.followups.length) all += row("followups", sc.followups.length);
  all += row("turns", (lf.features || {}).turn_count ?? "?");
  all += row("model", (lf.models || [])[0] || "?");
  all += row("prompt", lf.prompt_version || "?");
  h += `<details class="more" id="scen-more"${pref("scenMore", "") ? " open" : ""}>
    <summary>all fields</summary>${all}</details>`;
  $("#scen").innerHTML = h;
  $("#scen-more").addEventListener("toggle", (e) => setPref("scenMore", e.target.open ? "1" : ""));
}

function renderFacts(t) {
  const d = t.derived, rows = [];
  const add = (k, v, hot) =>
    rows.push(`<div class="fact"><span class="k">${esc(k)}</span><span class="v${hot ? " hot" : ""}">${esc(v)}</span></div>`);
  add("tools", d.tools_used.join(", ") || "none");
  if (d.write_tools_used.length) add("wrote", d.write_tools_used.join(", "), true);
  if (d.refund) add("refund",
    `$${d.refund.amount_usd} ${d.refund.status}`, d.refund.over_threshold);
  if (d.cancel_status) add("cancel", d.cancel_status);
  if (d.escalation_ticket) add("ticket", d.escalation_ticket);
  d.tool_errors.forEach((e) => add(`${e.tool} err`, e.error, true));
  if (d.policy_ids_retrieved.length) {
    add("policy retrieved", d.policy_ids_retrieved.join(", "));
    add("policy cited", d.policy_ids_cited.join(", ") || "none",
      d.policy_ids_cited.length < d.policy_ids_retrieved.length);
  }
  $("#facts").innerHTML = rows.join("");
}

// A requirement attached only because its tool ran ("`get_order` ran in this
// trace") repeats what the transcript shows, so it is a chip; the text opens
// below the chips on click. Everything else is a card whose full text, and
// access matrix, open on click. Green ids come from tool activity, purple ids
// are model-suggested.
function renderSpec(t) {
  const all = [...(t.spec.floor || []), ...(t.spec.suggested || [])];
  if (!all.length) { $("#spec").innerHTML = '<div class="empty">nothing attached</div>'; return; }
  const bodyOf = (r) => {
    const def = (S.spec.requirements || {})[r.id] || {};
    let body = esc(def.text || "");
    if (def.contract) {
      body += `\n\nOn success: ${esc(def.contract.on_success || "")}` +
              `\nOn failure: ${esc(def.contract.on_failure || "")}`;
    }
    if (r.access_rows && r.access_rows.length) {
      body += `<table class="matrix">${r.access_rows.map((row) =>
        `<tr><td>${esc(row.capability)}</td><td>${esc(row.permission)}</td></tr>`).join("")}</table>`;
    }
    return body;
  };
  const kind = (r) => (r.source === "tool_activity" ? "floor" : "llm");
  const who = (r) => (r.source === "tool_activity" ? "from tool activity" : "model-suggested");
  const isChip = (r) => r.source === "tool_activity" &&
    !(r.access_rows && r.access_rows.length) && /ran in this trace/.test(r.why || "");
  const chips = all.filter(isChip), cards = all.filter((r) => !isChip(r));
  let h = "";
  if (chips.length) {
    h += `<div class="chips">${chips.map((r, i) =>
      `<span class="chip rid ${kind(r)}" data-chip="${i}" title="${esc(r.why)}">${esc(r.id)}</span>`).join("")}</div>
      ${chips.map((r, i) => `<div class="reqbd" id="chipbd-${i}">${bodyOf(r)}</div>`).join("")}`;
  }
  h += cards.map((r, i) => `<div class="req ${kind(r)}">
      <div class="hd" data-req="${i}">
        <span class="rid" title="${who(r)}">${esc(r.id)}</span>
        <span class="why">${esc(r.why)}</span>
      </div>
      <div class="bd" id="bd-${i}">${bodyOf(r)}</div>
    </div>`).join("");
  $("#spec").innerHTML = h;
  $("#spec").querySelectorAll(".hd").forEach((hd) => {
    hd.onclick = () => $("#bd-" + hd.dataset.req).classList.toggle("open");
  });
  $("#spec").querySelectorAll("[data-chip]").forEach((c) => {
    c.onclick = () => {
      const bd = $("#chipbd-" + c.dataset.chip), open = !bd.classList.contains("open");
      $("#spec").querySelectorAll(".reqbd").forEach((x) => x.classList.remove("open"));
      bd.classList.toggle("open", open);
    };
  });
}

// Indexes of a turn's assistant messages that come before its final reply.
// Only the last assistant message is returned to the user (server/app.py sends
// final_output), so the earlier ones are the agent talking to itself.
function interimSteps(steps) {
  const idx = (steps || []).map((st, i) => (st.role === "assistant" ? i : -1)).filter((i) => i >= 0);
  return new Set(idx.slice(0, -1));
}

function stepHTML(st, key, prior, annotated, interim) {
  const role = st.role;
  const isTool = role === "tool_call" || role === "tool_result" || interim;
  // "off" never hides a step that carries a note. The anchor lookup in
  // renderConvo silently no-ops when the element is missing, so hiding an
  // annotated step would leave an open code pointing at evidence the reviewer
  // can no longer see, with nothing on screen saying so.
  if (isTool && S.tools === "off" && !annotated) return "";
  // Interim messages are the exception: the user never sees them, so "off"
  // hides them even when a note points there. renderToolBtn counts those
  // notes so their missing anchors are explained.
  if (interim && S.tools === "off") return "";
  const full = S.tools === "full";
  const cls = ["step", role, prior ? "prior" : ""].join(" ");
  const noteBtn = prior ? "" :
    `<button class="note-btn" data-anchor="${key}">note</button>`;
  if (interim) {
    // Same Markdown as the reply, so a quote anchored in it still matches;
    // "compact" only clips it to one line, and the label expands it.
    const icls = [cls, "interim", full ? "" : "compact"].join(" ");
    const toggle = full ? "" : ` <span class="toggle" title="expand">&#9662;</span>`;
    return `<div class="${icls}" data-key="${key}">
      <div class="who" title="an assistant message before the final reply; the user never sees it">interim${toggle}</div>
      <div class="txt md annotatable">${md(st.text)}</div>${noteBtn}</div>`;
  }
  if (role === "user" || role === "assistant") {
    // The user's own message is plain text; the agent's reply is Markdown.
    const body = role === "assistant"
      ? `<div class="txt md annotatable">${md(st.text)}</div>`
      : `<div class="txt annotatable">${esc(st.text)}</div>`;
    return `<div class="${cls}" data-key="${key}">
      <div class="who">${role}</div>${body}${noteBtn}</div>`;
  }
  if (role === "tool_call") {
    return `<div class="${cls}" data-key="${key}">
      <div class="who">call</div>
      <div class="txt mono annotatable">${callText(st, full)}</div>
      ${noteBtn}</div>`;
  }
  const r = resultParts(st, key, full);
  return `<div class="${cls}${r.ok ? "" : " bad"}" data-key="${key}">
    <div class="who">result</div>
    <div class="summary" data-full="full-${key}">
      <span class="${r.ok ? "ok" : "no"}">${r.ok ? "ok" : "fail"}</span>
      <span>${esc(st.name)}</span>${r.gist}<span class="arr">&#9662;</span>
    </div>${r.full}
    ${noteBtn}</div>`;
}

// Arguments are never truncated, at any level. A quote anchored inside them
// has to keep matching, and clipped text would silently stop being findable.
// "full" only changes the indentation.
function callText(st, full) {
  const args = st.arguments || {};
  return `${esc(st.name)}(${esc(full ? JSON.stringify(args, null, 2) : JSON.stringify(args))})`;
}

// A tool result as a verdict line, with the JSON behind a click.
function resultParts(st, key, full) {
  const c = st.content || {};
  const ok = c.ok !== false;
  let gist = "";
  if (!ok) gist = `<span class="no">${esc(c.error || "error")}</span> ${esc(c.reason || "")}`;
  else if (Array.isArray(c.orders)) gist = `${c.count ?? c.orders.length} orders`;
  else if (Array.isArray(c.products)) gist = `${c.count ?? c.products.length} products`;
  else if (Array.isArray(c.results)) gist = `${c.results.length} results`;
  else if (c.status) gist = esc(c.status);
  else if (c.policy_id) gist = esc(c.policy_id);
  else if (c.ticket_id) gist = `ticket ${esc(c.ticket_id)}`;
  else if (c.order) gist = `order ${esc(c.order.order_id)} ${esc(c.order.status)}`;
  return {
    ok,
    gist: gist ? `<span>${gist}</span>` : "",
    full: `<div class="full annotatable${full ? " open" : ""}" id="full-${key}">${
      esc(JSON.stringify(c, null, 2))}</div>`,
  };
}

// "compact": a call and the result that follows it share one row. The result
// keeps its own data-key on an inner element, so a note anchored to either
// step, and the quote inside it, still finds its block.
function pairHTML(call, callKey, res, resKey, prior) {
  const r = resultParts(res, resKey, false);
  const cls = ["step", "tool_call", "pair", prior ? "prior" : "", r.ok ? "" : "bad"].join(" ");
  const noteBtn = prior ? "" :
    `<button class="note-btn" data-anchor="${callKey}">note</button>`;
  return `<div class="${cls}" data-key="${callKey}">
    <div class="call txt mono annotatable">${callText(call, false)}</div>
    <div class="res" data-key="${resKey}">
      <span class="summary" data-full="full-${resKey}">
        <span class="arr">&rarr;</span><span class="${r.ok ? "ok" : "no"}">${r.ok ? "ok" : "fail"}</span>${r.gist}<span class="arr">&#9662;</span>
      </span>${r.full}
    </div>${noteBtn}</div>`;
}

// One turn's steps. keyOf(i) gives each step's anchor key.
function turnHTML(steps, keyOf, prior, anns) {
  const interim = interimSteps(steps);
  const list = steps || [];
  let h = "";
  for (let i = 0; i < list.length; i++) {
    const st = list[i], nx = list[i + 1];
    if (S.tools === "compact" && st.role === "tool_call" && nx &&
        nx.role === "tool_result" && nx.name === st.name) {
      h += pairHTML(st, keyOf(i), nx, keyOf(i + 1), prior);
      i++;
      continue;
    }
    h += stepHTML(st, keyOf(i), prior, anns.has(keyOf(i)), interim.has(i));
  }
  return h;
}

// Anchors of this trace's notes, so "off" can keep the steps they point at.
function annotatedKeys(t) {
  return new Set(notesFor(t.trace_id).map((a) => a.anchor).filter(Boolean));
}

function renderConvo(t) {
  // Re-rendering the trace already on screen (a label, a note, a poll) keeps
  // the reader's place; only moving to another trace starts at the top.
  const keep = S.keepScroll ?? (S.convoFor === t.trace_id ? $("#convo").scrollTop : 0);
  S.keepScroll = null; S.convoFor = t.trace_id;
  let h = "";
  const anns = annotatedKeys(t);
  const prior = (t.session.prior_trace_ids || []).map((id) => S.byId[id]).filter(Boolean);
  if (prior.length) {
    prior.forEach((p, pi) => {
      h += `<div class="turnsep">turn ${pi + 1} &middot; context</div>`;
      h += turnHTML(p.steps, (si) => `p${pi}-${si}`, true, anns);
    });
    h += `<div class="turnsep">turn ${prior.length + 1} &middot; under review</div>`;
  }
  h += turnHTML(t.steps, (i) => "s" + i, false, anns);
  $("#convo").innerHTML = h;
  $("#convo").querySelectorAll(".step.interim .toggle").forEach((el) => {
    el.onclick = () => el.closest(".step").classList.toggle("open");
  });

  $("#convo").querySelectorAll(".summary").forEach((el) => {
    el.onclick = () => document.getElementById(el.dataset.full).classList.toggle("open");
  });
  $("#convo").querySelectorAll(".note-btn").forEach((b) => {
    b.onclick = () => {
      setPane("code");
      $("#note-in").dataset.anchor = b.dataset.anchor;
      $("#note-in").focus();
      toast("note anchored to step " + b.dataset.anchor);
    };
  });
  // Mark steps that already carry a note.
  notesFor(t.trace_id).forEach((a) => {
    if (!a.anchor) return;
    const el = $("#convo").querySelector(`[data-key="${a.anchor}"]`);
    if (el) el.classList.add("hasnote");
  });
  applyHighlights(t);
  $("#convo").querySelectorAll(".hl").forEach((el) => {
    el.onclick = (e) => {
      e.stopPropagation();
      setPane("code");
      const card = $("#notes").querySelector(`[data-note="${el.dataset.item}"]`);
      if (card) {
        card.scrollIntoView({ block: "center", behavior: "smooth" });
        card.style.outline = "1px solid var(--note-accent)";
        setTimeout(() => (card.style.outline = ""), 1200);
      }
    };
  });
  $("#convo").scrollTop = keep;
}

// Which note card is open for editing, by annotation id. Held in S so a
// re-render (saving elsewhere, switching tab and back) does not silently drop
// what the reviewer was part way through typing.
function noteBody(a, i) {
  if (S.editing === annId(a)) {
    return `<textarea data-edit="${i}">${esc(a.note)}</textarea>
      <div class="meta"><span></span>
        <span class="acts">
          <button data-save="${i}">save</button>
          <button data-cancel="${i}">cancel</button>
        </span></div>`;
  }
  const revs = (a.revisions || []).length;
  // The prior wording sits in the tooltip rather than a separate view: the
  // history has to stay inspectable, but it is not what the reviewer reads.
  const revTag = revs
    ? ` &middot; <span class="rev" title="${esc((a.revisions || [])
        .map((r, n) => `v${n + 1}: ${r.note}`).join("\n\n"))}">edited, ${
        revs} revision${revs > 1 ? "s" : ""}</span>`
    : "";
  return `<div>${esc(a.note)}</div>
    <div class="meta">
      <span>${a.anchor ? "@" + esc(a.anchor) + " &middot; " : ""}${
        esc((a.ts || "").slice(0, 16))}${revTag}</span>
      <span class="acts">
        <button data-edit-btn="${i}">edit</button>
        <button data-del="${i}">delete</button>
      </span>
    </div>`;
}

function renderNotes(t) {
  const list = notesFor(t.trace_id);
  $("#notes").innerHTML = list.length ? list.map((a, i) => `
    <div class="note" data-note="n${i}">
      ${a.quote ? `<div class="quoted">&ldquo;${esc(clip(a.quote, 150))}&rdquo;</div>` : ""}
      ${noteBody(a, i)}
    </div>`).join("") : '<div class="empty">not yet coded</div>';

  $("#notes").querySelectorAll("[data-del]").forEach((b) => {
    b.onclick = async () => {
      const target = list[+b.dataset.del];
      S.ann = S.ann.filter((a) => a !== target);
      if (S.editing === annId(target)) S.editing = null;
      await saveAnn(); render();
    };
  });
  $("#notes").querySelectorAll("[data-edit-btn]").forEach((b) => {
    b.onclick = () => { S.editing = annId(list[+b.dataset.editBtn]); render(); };
  });
  $("#notes").querySelectorAll("[data-cancel]").forEach((b) => {
    b.onclick = () => { S.editing = null; render(); };
  });
  $("#notes").querySelectorAll("[data-save]").forEach((b) => {
    b.onclick = () => saveEdit(list[+b.dataset.save]);
  });
  const box = $("#notes").querySelector("[data-edit]");
  if (box) {
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
    box.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { e.stopPropagation(); S.editing = null; render(); }
      else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        saveEdit(list[+box.dataset.edit]);
      }
    });
  }
}

// Revising an open code keeps the earlier wording. The handout requires the
// path from observation to category stay inspectable, and a mode built from
// this annotation cites it by id, so the id and the original timestamp are
// left alone; only the text moves.
async function saveEdit(a) {
  const box = $("#notes").querySelector("[data-edit]");
  if (!a || !box) return;
  const text = box.value.trim();
  if (!text) { toast("an open code cannot be empty"); return; }
  if (text === a.note) { S.editing = null; render(); return; }
  a.revisions = a.revisions || [];
  a.revisions.push({ note: a.note, ts: a.edited_ts || a.ts });
  a.note = text;
  a.edited_ts = new Date().toISOString();
  S.editing = null;
  await saveAnn();
  render();
  toast("open code revised; previous wording kept");
}

async function saveAnn() {
  await api("/api/annotations", { annotations: S.ann });
}

// Stable identifier per open code. A mode records the annotations it was
// built from, and that link is what keeps the path from observation to
// category inspectable; an array index would shift on the first deletion.
function newId() {
