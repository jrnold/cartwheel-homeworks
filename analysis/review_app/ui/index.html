  return "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// Older records (and anything hand-edited in) may predate ids. Fall back to a
// deterministic key so grouping still works rather than silently dropping them.
function annId(a) {
  return a.id || `${a.trace_id}@${a.ts}`;
}

async function addNote(text, anchor, quote) {
  const t = cur(); if (!t) return;
  S.ann.push({
    id: newId(),
    trace_id: t.trace_id,
    session_id: t.session.session_id,
    scenario_id: t.langfuse.scenario_id,
    note: text,
    // TODO(jeff): record where this trace came from, so batch 4 can be
    // reconstructed from the depth-search reading later. The batch name is
    // S.batchOf[t.trace_id], undefined when the escape hatch reached the
    // trace; S.filter is the scope that was active when it was opened.
    // Without this, an open code written during a depth search is
    // indistinguishable from one written during sampled review.
    anchor: anchor || null,
    // The exact words the note is about. Stored verbatim so the evidence
    // behind an open code stays inspectable, which is what lets a mode later
    // cite the annotation it came from.
    quote: quote || null,
    ts: new Date().toISOString(),
    source: "human",
  });
  await saveAnn();
  $("#note-in").value = ""; delete $("#note-in").dataset.anchor;
  render(); toast("note saved");
}

// ---------------------------------------------------------------- select-to-annotate
let pending = null; // {anchor, quote}

function closePopover(rerender) {
  pending = null;
  $("#popover").style.display = "none";
  $("#pop-note").value = "";
  if (rerender) { S.keepScroll = $("#convo").scrollTop; render(); }
}

$("#convo").addEventListener("mouseup", () => {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) return;
  const quote = sel.toString().trim();
  if (!quote) return;
  const node = sel.anchorNode;
  const block = node && (node.nodeType === 1 ? node : node.parentElement)
    ?.closest(".annotatable");
  if (!block) return;
  const step = block.closest("[data-key]");
  if (!step || step.classList.contains("prior")) return; // context is read-only

  pending = { anchor: step.dataset.key, quote };

  // Mark the selection before the popover steals focus: clicking into the
  // textarea collapses the native selection, and without a standing highlight
  // the reviewer loses sight of what the note is about.
  $("#convo").querySelectorAll(".hl.pending").forEach((el) => el.replaceWith(
    ...el.childNodes));
  markQuote(block, quote, "hl pending");
  sel.removeAllRanges();

  const mark = $("#convo").querySelector(".hl.pending");
  const rect = (mark || block).getBoundingClientRect();
  const pop = $("#popover");
  pop.style.display = "block";
  const top = Math.min(rect.bottom + 6, window.innerHeight - pop.offsetHeight - 10);
  pop.style.left = Math.min(rect.left, window.innerWidth - 345) + "px";
  pop.style.top = (window.scrollY + top) + "px";
  $("#pop-quote").textContent = quote.length > 220 ? quote.slice(0, 220) + "…" : quote;
  $("#pop-note").focus();
});

$("#pop-save").onclick = async () => {
  const note = $("#pop-note").value.trim();
  if (!note || !pending) { closePopover(true); return; }
  const { anchor, quote } = pending;
  S.keepScroll = $("#convo").scrollTop;
  closePopover(false);
  await addNote(note, anchor, quote);
};
$("#pop-cancel").onclick = () => closePopover(true);
$("#pop-note").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.stopPropagation(); closePopover(true); }
  else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault(); e.stopPropagation(); $("#pop-save").click();
  }
});
document.addEventListener("mousedown", (e) => {
  if ($("#popover").style.display === "block" && !$("#popover").contains(e.target)) {
    closePopover(true);
  }
});

function renderSuggs(t) {
  const mine = S.suggs.filter((s) => s.trace_id === t.trace_id);
  // The whole block, heading included, stays out of the way until there is
  // something to decide. It returns on its own once Part D's search runs.
  $("#suggs-block").hidden = mine.length === 0;
  if (!mine.length) { $("#suggs").innerHTML = ""; return; }
  $("#suggs").innerHTML = mine.length ? mine.map((s, i) => {
    if (s.verdict) {
      return `<div class="sugg"><div>${esc(s.text)}</div>
        <div class="meta">
        ${esc(s.verdict)}${s.reason ? " — " + esc(s.reason) : ""}</div></div>`;
    }
    return `<div class="sugg">
      <div>${esc(s.text)}</div>
      <div class="meta">${esc(s.origin || "ai")}</div>
      <div class="row">
        <button data-acc="${i}">accept as open code</button>
        <button data-rej="${i}">reject</button>
      </div></div>`;
  }).join("") : '<div class="empty">none for this trace</div>';

  $("#suggs").querySelectorAll("[data-acc]").forEach((b) => {
    b.onclick = async () => {
      const s = mine[+b.dataset.acc];
      s.verdict = "accepted"; s.decided_at = new Date().toISOString();
      await api("/api/suggestions", S.suggs);
      // Carry the quote across: accepting should strengthen the evidence, not
      // drop it. Without this the purple suggestion highlight vanishes the
      // moment it becomes an annotation, because there is no quote to re-match.
      await addNote(s.text, s.anchor, s.quote);
      toast("accepted — recorded as your open code");
    };
  });
  $("#suggs").querySelectorAll("[data-rej]").forEach((b) => {
    b.onclick = async () => {
      const s = mine[+b.dataset.rej];
      const why = prompt("Why is this not an instance? (the boundary that excludes it)");
      if (why === null) return;
      s.verdict = "rejected"; s.reason = why; s.decided_at = new Date().toISOString();
      await api("/api/suggestions", S.suggs);
      render(); toast("rejected — reason saved");
    };
  });
}

function renderLabels(t) {
  if (!S.modes.length) {
    $("#labels").innerHTML = '<div class="empty">no modes yet</div>';
    return;
  }
  // The number is the mode's digit key (N = Fail, shift+N = Pass).
  $("#labels").innerHTML = S.modes.map((m, i) => {
    const rec = (S.labels[m.name] || {})[t.trace_id];
    const v = rec ? rec.label : null;
    return `<div class="lbl">
      <span class="n">${i < 9 ? i + 1 : ""}</span>
      <span class="nm" title="${esc(m.name)}\n\n${esc(m.definition || "")}">${esc(modeLabel(m.name))}</span>
      <button class="pass ${v === 0 ? "on" : ""}" data-m="${esc(m.name)}" data-v="0">P</button>
      <button class="fail ${v === 1 ? "on" : ""}" data-m="${esc(m.name)}" data-v="1">F</button>
    </div>`;
  }).join("");
  $("#labels").querySelectorAll("button[data-m]").forEach((b) => {
    b.onclick = () => setLabel(b.dataset.m, +b.dataset.v);
  });
}

// snake_case mode names read as prose in the panel and the grid headers.
function modeLabel(name) { return String(name).replace(/_/g, " "); }

async function setLabel(mode, label) {
  const t = cur(); if (!t) return;
  try {
    const r = await api("/api/labels", { trace_id: t.trace_id, mode, label });
    S.labels[mode] = S.labels[mode] || {};
    S.labels[mode][t.trace_id] = { trace_id: t.trace_id, label, label_id: r.label_id };
    render();
    toast(r.langfuse_error ? "saved locally; Langfuse failed: " + r.langfuse_error
      : (r.langfuse ? "saved + scored in Langfuse" : "saved locally"));
  } catch (e) { toast("save failed: " + e.message); }
}

// ---------------------------------------------------------------- taxonomy
async function saveModes() {
  await api("/api/patterns", { modes: S.modes });
}

function idList(s) {
  return String(s || "").split(/[\s,]+/).filter(Boolean);
}

// A trace id as its scenario, with the turn when the session has several, so
// "support-0062" can be read and clicked instead of a 32-character hash.
function traceName(id) {
  const t = S.byId[id];
  if (!t) return id.slice(0, 10);
  const s = t.session || {};
  return t.langfuse.scenario_id + (s.turn_count > 1 ? ` t${s.turn_index + 1}` : "");
}

function traceChips(i, field, ids) {
  return `<div class="chips">${ids.map((id) =>
    `<span class="chip${S.byId[id] ? "" : " unknown"}" data-open="${esc(id)}" title="${esc(id)}">${
      esc(traceName(id))}<button class="x" data-m="${i}" data-rm="${field}" data-id="${esc(id)}" title="remove">&times;</button></span>`).join("")}
    <input class="chipadd" data-m="${i}" data-add="${field}" placeholder="+ trace id"></div>`;
}

// One line per open code: the note, with its quoted evidence in the hover
// text, and the trace it came from.
function codeLine(a, tail) {
  const q = a.quote ? ` title="${esc("“" + a.quote + "”")}"` : "";
  return `<div class="code"><span class="ct"${q}>${esc(a.note)}</span>
    <span class="cs" data-open="${esc(a.trace_id || "")}">${esc(traceName(a.trace_id || ""))}</span>${tail}</div>`;
}

function renderTax() {
  // Which open codes already belong to a mode. Used for real now: the
  // "not yet grouped" list is the reviewer's remaining work queue, so
  // including already-grouped codes would make it never empty.
  const grouped = new Set();
  S.modes.forEach((m) => (m.annotations || []).forEach((id) => grouped.add(id)));
  const byId = {};
  S.ann.forEach((a) => { byId[annId(a)] = a; });

  $("#tax").innerHTML = S.modes.length ? S.modes.map((m, i) => {
    const live = S.labels[m.name] || {};
    const f = Object.values(live).filter((r) => r.label === 1).length;
    const p = Object.values(live).filter((r) => r.label === 0).length;
    const gaps = [];
    if (!m.definition) gaps.push("definition");
    if ((m.positives || []).length < 3) gaps.push("3 positives");
    if ((m.close_negatives || []).length < 3) gaps.push("3 close negatives");
    if (!m.boundary) gaps.push("boundary");
    if (!m.evaluator) gaps.push("evaluator type");
    if (!m.requirement) gaps.push("SPEC requirement");
    const status = gaps.length
      ? `<span class="src gap" title="missing: ${esc(gaps.join(", "))}">${gaps.length} missing</span>`
      : "";

    const mine = (m.annotations || []).map((id) => byId[id]).filter(Boolean);
    const open = S.taxOpen.has(m.name) ? " open" : "";
    return `<details class="mode" data-name="${esc(m.name)}"${open}>
      <summary>
        <span class="mn">${esc(m.name)}</span>
        <span class="mcnt"><b>${f}</b> F / ${p} P</span>
        ${status}
        <span class="mdef">${esc((m.definition || "").split("\n")[0])}</span>
      </summary>
      <div class="mbody">
        <label>Name
          <input class="mono" data-m="${i}" data-f="name" value="${esc(m.name)}"></label>
        <label>Binary definition
          <textarea data-m="${i}" data-f="definition">${esc(m.definition || "")}</textarea></label>
        <label>Boundary
          <textarea data-m="${i}" data-f="boundary">${esc(m.boundary || "")}</textarea></label>
        <div class="mrow">
          <label>Evaluator
            <select data-m="${i}" data-f="evaluator">
              <option value=""${!m.evaluator ? " selected" : ""}>—</option>
              <option value="code check"${m.evaluator === "code check" ? " selected" : ""}>code check</option>
              <option value="LLM judge"${m.evaluator === "LLM judge" ? " selected" : ""}>LLM judge</option>
            </select></label>
          <label>Requirement source
            <input data-m="${i}" data-f="requirement" list="req-ids"
              value="${esc(m.requirement || "")}"></label>
        </div>
        <div class="mrow">
          <label>Positives (${(m.positives || []).length})
            ${traceChips(i, "positives", m.positives || [])}</label>
          <label>Close negatives (${(m.close_negatives || []).length})
            ${traceChips(i, "close_negatives", m.close_negatives || [])}</label>
        </div>
        <div class="grp">Open codes (${mine.length})</div>
        <div class="codes">${mine.length ? mine.map((a) => codeLine(a,
          `<button data-unlink="${i}" data-aid="${esc(annId(a))}" title="unlink">&times;</button>`)).join("")
          : '<div class="empty">none</div>'}</div>
        <div class="mfoot"><button data-del-mode="${i}">delete mode</button></div>
      </div>
    </details>`;
  }).join("") : '<div class="empty">no modes yet</div>';

  // Only codes that describe a failure and are not already grouped.
  const un = S.ann.filter((a) =>
    a.note && !/^no failure observed/i.test(a.note) && !grouped.has(annId(a)));
  const opts = S.modes.map((m, i) =>
    `<option value="${i}">${esc(m.name)}</option>`).join("");
  $("#ungrouped").innerHTML = un.length ? `<div class="codes">${un.map((a) => codeLine(a,
    S.modes.length ? `<select data-assign="${esc(annId(a))}"><option value="">assign to…</option>${opts}</select>` : ""
  )).join("")}</div>` : '<div class="empty">none</div>';

  $("#tax-count").textContent =
    `${S.modes.length} modes · ${un.length} ungrouped · ${grouped.size} grouped`;

  // -- wiring ---------------------------------------------------------
  $("#tax").querySelectorAll("details.mode").forEach((d) => {
    d.addEventListener("toggle", () => {
      if (d.open) S.taxOpen.add(d.dataset.name); else S.taxOpen.delete(d.dataset.name);
    });
  });
  $("#tax").querySelectorAll("[data-f]").forEach((el) => {
    el.onchange = async () => {
      const m = S.modes[+el.dataset.m];
      const f = el.dataset.f;
      if (f === "name") {
        const old = m.name, next = el.value.trim();
        if (!next) { el.value = old; return; }
        if (old !== next && S.labels[old]) {
          if (!confirm(
            `Labels are already saved under "${old}".\n\n` +
            `Renaming leaves labels/${old}.jsonl behind and starts a new file ` +
            `for "${next}". Rename anyway?`)) { el.value = old; return; }
        }
        m.name = next;
        if (S.taxOpen.delete(old)) S.taxOpen.add(next);
      } else m[f] = el.value;
      await saveModes(); render();
    };
  });
  $("#tax").querySelectorAll("[data-add]").forEach((el) => {
    el.onchange = async () => {
      const m = S.modes[+el.dataset.m], f = el.dataset.add;
      const cur = m[f] || [];
      m[f] = [...cur, ...idList(el.value).filter((id) => !cur.includes(id))];
      await saveModes(); render();
    };
  });
  $("#tax").querySelectorAll("[data-rm]").forEach((b) => {
    b.onclick = async (e) => {
      e.preventDefault(); e.stopPropagation();
      const m = S.modes[+b.dataset.m], f = b.dataset.rm;
      m[f] = (m[f] || []).filter((id) => id !== b.dataset.id);
      await saveModes(); render();
    };
  });
  document.querySelectorAll("#tax [data-open], #ungrouped [data-open]").forEach((el) => {
    el.onclick = (e) => { if (e.target.closest("button")) return; e.preventDefault(); openInReview(el.dataset.open); };
  });
  $("#tax").querySelectorAll("[data-del-mode]").forEach((b) => {
    b.onclick = async () => {
      const m = S.modes[+b.dataset.delMode];
      if (!confirm(`Delete mode "${m.name}"?\n\nAny labels already saved under ` +
        `it stay in labels/${m.name}.jsonl.`)) return;
      S.modes.splice(+b.dataset.delMode, 1);
      S.taxOpen.delete(m.name);
      await saveModes(); render();
    };
  });
  $("#tax").querySelectorAll("[data-unlink]").forEach((b) => {
    b.onclick = async () => {
      const m = S.modes[+b.dataset.unlink];
      m.annotations = (m.annotations || []).filter((id) => id !== b.dataset.aid);
      await saveModes(); render();
    };
  });
  $("#ungrouped").querySelectorAll("[data-assign]").forEach((sel) => {
    sel.onchange = async () => {
      if (sel.value === "") return;
      const m = S.modes[+sel.value];
      m.annotations = [...(m.annotations || []), sel.dataset.assign];
      await saveModes(); render();
      toast(`grouped under ${m.name}`);
    };
  });
}

// Inline rather than prompt(): a modal blocks the page, and naming a mode is
// something you do while reading the codes it came from.
async function newMode() {
  const input = $("#new-mode-name");
  const clean = input.value.trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
  if (!clean) { input.focus(); return; }
  if (S.modes.some((m) => m.name === clean)) { toast("that mode already exists"); return; }
  S.modes.push({
    name: clean, definition: "", boundary: "", evaluator: "", requirement: "",
    annotations: [], positives: [], close_negatives: [],
    created: new Date().toISOString(),
  });
  input.value = "";
  await saveModes(); render();
  toast(`added ${clean}`);
}

// ---------------------------------------------------------------- labeling
// Progress and the trace-by-mode matrix on one page. Counts in the column
// headers are over the traces the scope filter shows, so with "in sample"
// selected the judged count can never exceed the sample. (The old Progress
// table divided every label on file, sample or not, by the sample size.)
const HW5_MIN = 30;

function renderLabSum() {
  const total = sampleSize();
  const codedIds = new Set(S.ann.map((a) => a.trace_id));
  const coded = S.pool.filter((t) => inSample(t) && codedIds.has(t.trace_id)).length;
  const offCoded = S.pool.filter((t) => !inSample(t) && codedIds.has(t.trace_id)).length;
  const pct = total ? Math.round((coded / total) * 100) : 0;
  const acc = S.suggs.filter((s) => s.verdict === "accepted").length;
  const rej = S.suggs.filter((s) => s.verdict === "rejected").length;
  const pend = S.suggs.filter((s) => !s.verdict).length;
  const stat = (k, v, title) =>
    `<span class="stat"${title ? ` title="${esc(title)}"` : ""}><span class="k">${k}</span><span class="v">${v}</span></span>`;

  let h = `<div class="labsum">
    ${stat("open-coded", `${coded} / ${total}${total < 100 ? ` <span class="bad" title="the review set needs 100">(${100 - total} to draw)</span>` : ""}`)}
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${stat("off-manifest", offCoded)}
    ${stat("suggestions", `${acc} accepted · <span class="${rej ? "" : "bad"}" title="${rej ? "" : "the saved state needs at least one rejected suggestion"}">${rej} rejected</span> · ${pend} pending`)}
    <span class="grow" style="flex:1"></span>
    <label><input type="checkbox" id="failonly"${S.failOnly ? " checked" : ""}> rows with a Fail</label>
  </div>`;

  // Batches collapse, and the worklists (wl-*) collapse again inside them:
  // they are the long tail of the manifest and rarely what you came for.
  if (S.manifest.batches.length) {
    const row = (b) => {
      const ids = (b.picks || []).map((p) => p.trace_id);
      const done = ids.filter((id) => codedIds.has(id)).length;
      return `<tr><td class="mono"><a href="#batch=${encodeURIComponent(b.name)}">${esc(b.name)}</a></td>
        <td class="c">${done} / ${ids.length}</td></tr>`;
    };
    const main = S.manifest.batches.filter((b) => !b.name.startsWith("wl-"));
    const wl = S.manifest.batches.filter((b) => b.name.startsWith("wl-"));
    const by = (fn) => {
      const c = {};
      S.pool.forEach((t) => { const k = fn(t) ?? "—"; c[k] = (c[k] || 0) + 1; });
      return Object.entries(c).map(([k, v]) => `${esc(k)} ${v}`).join(", ");
    };
    h += `<details class="batches"><summary>Batches (${S.manifest.batches.length}) and pool</summary>
      <table class="grid"><tr><th>batch</th><th>coded</th></tr>${main.map(row).join("")}</table>
      ${wl.length ? `<details><summary>worklists (${wl.length})</summary>
        <table class="grid"><tr><th>worklist</th><th>coded</th></tr>${wl.map(row).join("")}</table></details>` : ""}
      <div class="pooldims">pool ${S.pool.length} traces · ${
        new Set(S.pool.map((t) => t.session.session_id)).size} sessions · role: ${
        by((t) => t.langfuse.user_role)} · group: ${by((t) => (t.scenario || {}).scenario_group)}</div>
    </details>`;
  }
  $("#labsum").innerHTML = h;
  $("#failonly").onchange = (e) => { S.failOnly = e.target.checked; renderGrid(); };
}

function renderGrid() {
  renderLabSum();
  if (!S.modes.length) {
    $("#lblgrid").innerHTML = '<div class="empty">no modes yet</div>'; return;
  }
  const v = visible();
  const labelOf = (m, t) => ((S.labels[m.name] || {})[t.trace_id] || {}).label;
  const head = S.modes.map((m, i) => {
    const judged = v.filter((t) => labelOf(m, t) != null).length;
    const f = v.filter((t) => labelOf(m, t) === 1).length;
    // The HW5 minimum counts every label on file, not just this scope.
    const all = Object.values(S.labels[m.name] || {});
    const af = all.filter((r) => r.label === 1).length, ap = all.filter((r) => r.label === 0).length;
    const short = af < HW5_MIN || ap < HW5_MIN;
    const tip = `${m.name} (key ${i + 1})\n${f} fail of ${judged} judged in this scope` +
      (short ? `\nbelow the HW5 minimum: ${af} fail, ${ap} pass on file; needs ${HW5_MIN} of each` : "");
    return `<th class="mcol${short ? " short" : ""}" title="${esc(tip)}">
      <div class="vh">${esc(modeLabel(m.name))}</div><div class="cnt"><b>${f}</b>/${judged}</div></th>`;
  }).join("");
  const c = cur();
  const rows = v.map((t, i) => ({ t, i })).filter(({ t }) =>
    !S.failOnly || S.modes.some((m) => labelOf(m, t) === 1)).map(({ t, i }) => {
    const cells = S.modes.map((m) => {
      const l = labelOf(m, t);
      return `<td class="m${l === 1 ? " F" : l == null ? " none" : ""}"></td>`;
    }).join("");
    const n = notesFor(t.trace_id).length;
    return `<tr data-i="${i}" class="${t === c ? "cur" : ""}">
      <td class="mono">${esc(traceName(t.trace_id))}</td>
      <td class="role">${esc(t.langfuse.user_role)}</td>${cells}
      <td class="t" title="open codes">${n || ""}</td></tr>`;
  }).join("");
  $("#lblgrid").innerHTML = `<table class="grid lg"><thead><tr>
    <th>trace</th><th>role</th>${head}<th title="open codes">codes</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
  $("#lblgrid").querySelectorAll("tr[data-i]").forEach((tr) => {
    tr.onclick = () => { S.idx = +tr.dataset.i; S.view = "review"; render(); };
  });
}

// ---------------------------------------------------------------- map
// A port of the static trace map (analysis/trace_map/ui/index.html): the same
// three panes, canvas, pan and zoom, numbered cluster badges, up-to-three
// cluster highlights, reference shapes and cluster profiles. What the app adds:
// "Color: review" for Part B coverage, sample and review counts per cluster,
// the current trace ringed, and double-click (or the button) opens the trace in
// Review. Data comes from /api/graph: the trace map's build when there is one,
// else the plain clustering run.
async function loadGraph() {
  if (!S.graph) S.graph = await api("/api/graph");
  return S.graph;
}

function renderMap() {
  if (!S.graph) {
    TM.empty("loading…");
    loadGraph().then(() => { TM.load(S.graph); if (S.view === "map") TM.show(); })
      .catch((e) => TM.empty("map failed: " + esc(e.message)));
    return;
  }
  if (!TM.loaded()) TM.load(S.graph);
  TM.show();
}

function openInReview(id) {
  if (!S.byId[id]) return;
  // Open it under a scope that contains it. An off-manifest trace switches the
  // scope to all traces, and says so: reading it does not count toward the 100.
  if (!visible().some((t) => t.trace_id === id)) {
    S.filter = S.batchOf[id] ? "sample" : "all";
    $("#filter").value = S.filter;
    if (S.filter === "all") toast("off-manifest trace — does not count toward the 100");
  }
  S.idx = visible().findIndex((t) => t.trace_id === id);
  S.view = "review"; render();
}

const TM = (() => {
  const el = (id) => document.getElementById("tm-" + id);
  const root = document.getElementById("tm");
  const cssv = (v) => getComputedStyle(root).getPropertyValue(v).trim();
  const SLOT_VARS = ["--s1", "--s2", "--s3"];
  const KIND_LABEL = { policy: "policies", store: "stores", tool: "tools", spec: "spec items" };
  const M = {
    run: null, points: [], byId: new Map(), clusterById: new Map(),
    highlight: [], open: null, selected: null, pane: "intro", paneCluster: null,
    badges: [], refs: [], refById: new Map(),
    refKinds: new Set(),  // reference kinds drawn; off until asked for
    selectedRef: null, hoverRef: null, hover: null, query: "",
    view: { k: 1, tx: 0, ty: 0 }, colorBy: "cluster", mode: null,
  };
  const INTRO = el("detail").innerHTML;
  const canvas = el("map");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, base = { sx: 1, ox: 0, oy: 0 };

  const slotOf = (c) => { const i = M.highlight.indexOf(c); return i < 0 ? null : cssv(SLOT_VARS[i]); };
  const coded = () => new Set(S.ann.map((a) => a.trace_id));
  const statusOf = (id, cd) => (cd.has(id) ? "reviewed" : S.batchOf[id] ? "sampled" : "pool");
  // Live label for the selected mode: 1 = fail, 0 = pass, null = not labeled.
  const labelOf = (id) => {
    const rec = M.mode && (S.labels[M.mode] || {})[id];
    return rec ? rec.label : null;
  };
  const describedOf = (c) => (M.run.cluster_summaries || {})[String(c)] || null;
  const matches = (p) => !M.query || p.hay.includes(M.query);
  const refMatches = (r) => !M.query || r.hay.includes(M.query);
  const pct = (x) => `${Math.round(100 * x)}%`;

  function empty(html) { const e = el("empty"); e.innerHTML = html ? `<div>${html}</div>` : ""; e.hidden = !html; }

  function load(run) {
    M.run = run;
    M.clusterById = new Map((run.clusters || []).map((c) => [c.cluster, c]));
    M.points = Object.entries(run.traces || {}).map(([tid, t]) => {
      const s = t.summary && typeof t.summary === "object" ? t.summary : {};
      const tools = (s.tool_activity || []).map((a) => `${a.name} ${a.result}`).join(" ");
      return { id: tid, x: t.x, y: t.y, cluster: t.cluster, summary: s, source: t.summary_source,
        hay: `${tid} ${s.title} ${s.user_goal} ${s.outcome} ${tools}`.toLowerCase() };
    });
    M.byId = new Map(M.points.map((p) => [p.id, p]));
    M.refs = (run.references || []).map((r) => ({ ...r, hay: `${r.id} ${r.name} ${r.text}`.toLowerCase() }));
    M.refById = new Map(M.refs.map((r) => [r.id, r]));
    renderKinds();
    renderMeta();
    // A server started before the map moved to the trace map's format still
    // answers /api/graph with {nodes, clusters}; say so instead of an empty map.
    const stale = !M.points.length && Array.isArray(run.nodes) && run.nodes.length;
    empty(M.points.length ? "" : stale
      ? 'The review server is running older code. Restart it (<code>uv run python -m analysis.review_app.server</code>), then reload.'
      : 'No map data yet. Build it with <code>uv run python -m analysis.trace_map</code>, then reload.');
    fitView();
  }

  function show() {
    // The canvas has no size until the view is on screen.
    requestAnimationFrame(() => {
      if (M.colorBy === "mode") { renderModes(); el("mode").value = M.mode || ""; }
      resize(); renderClusters(); renderDetail();
    });
  }

  function renderMeta() {
    const b = M.run.backends || {};
    const short = (v) => String(v || "").replace(/ \(.*\)$/, "").replace(/^(llm|ollama|litellm):/, "");
    // One quiet line; the full provenance is in its hover text.
    const full = [
      M.run.origin === "trace_map" ? "trace map build (python -m analysis.trace_map)" : "clustering run (python -m analysis.trace_clusters)",
      `trace summaries: ${b.summarizer}`,
      b.cluster_summaries ? `cluster summaries: ${b.cluster_summaries}` : "",
      `embeddings: ${b.embedder}`,
      `clusters: HDBSCAN on a ${b.reducer} reduction; layout: ${b.projection || b.reducer}`,
    ].filter(Boolean).join("\n");
    el("runmeta").innerHTML = !M.points.length ? "" :
      `<span class="faint small" title="${esc(full)}">${M.run.n_traces} traces · ${(M.run.clusters || []).length} clusters · ${esc(short(b.embedder))} · ${esc(b.reducer)}</span>`;
  }

  // ------------------------------------------------------------ cluster list
  function toggleHighlight(c) {
    const i = M.highlight.indexOf(c);
    if (i >= 0) M.highlight.splice(i, 1);
    else { if (M.highlight.length === 3) M.highlight.shift(); M.highlight.push(c); }
  }

  function renderClusters() {
    if (!M.run) return;
    const cd = coded();
    const rows = (M.run.clusters || []).map((c) => ({ ...c }));
    rows.push({ cluster: -1, label: "Unclustered: no group explains these", size: (M.run.unclustered || []).length,
      representatives: [], members: M.run.unclustered || [] });
    el("clusters").innerHTML = rows.filter((c) => c.size).map((c) => {
      const color = slotOf(c.cluster);
      const sw = c.cluster === -1 ? `<span class="sw ring"></span>`
        : `<span class="sw" style="${color ? `background:${color}` : ""}"></span>`;
      const hits = M.query ? c.members.filter((m) => M.byId.get(m)?.hay.includes(M.query)).length : null;
      const d = describedOf(c.cluster);
      const name = c.cluster === -1 ? "Unclustered" : (d?.title || c.label);
      const smp = c.members.filter((m) => S.batchOf[m]).length;
      const rev = c.members.filter((m) => cd.has(m)).length;
      const fails = M.colorBy === "mode" && M.mode ? c.members.filter((m) => labelOf(m) === 1).length : null;
      return `<div class="cl${M.open === c.cluster ? " on" : ""}" data-c="${c.cluster}" title="${esc(c.label)}">
        ${sw}<span class="num">${c.cluster === -1 ? "–" : "#" + c.cluster}</span>
        <span class="lab">${esc(name)}<span class="cov">${smp} sampled · ${rev} coded${fails !== null ? ` · <span class="f">${fails} fail</span>` : ""}</span></span>
        <span class="n">${hits !== null ? `${hits}/` : ""}${c.size}</span></div>`;
    }).join("");
  }
  el("clusters").addEventListener("click", (e) => {
    const row = e.target.closest(".cl");
    if (row) selectCluster(Number(row.dataset.c), { toggle: true });
  });

  function selectCluster(c, { toggle = false } = {}) {
    const showing = M.pane === "cluster" && M.paneCluster === c;
    if (toggle && showing) {
      const i = M.highlight.indexOf(c);
      if (i >= 0) M.highlight.splice(i, 1);
      M.open = null;
      M.pane = M.selected ? "trace" : "intro";
    } else {
      if (c !== -1 && !M.highlight.includes(c)) toggleHighlight(c);
      M.open = c; M.pane = "cluster"; M.paneCluster = c;
    }
    renderClusters(); renderDetail(); draw();
    root.querySelector(".cl.on")?.scrollIntoView({ block: "nearest" });
  }

  // ------------------------------------------------------------ canvas
  function resize() {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    computeBase(); draw();
  }
  function computeBase() {
    if (!M.points.length || !W) return;
    // Fit what is drawn: hidden reference items would otherwise shrink the map.
    const all = [...M.points, ...M.refs.filter((r) => M.refKinds.has(r.kind))];
    const xs = all.map((p) => p.x), ys = all.map((p) => p.y);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    const pad = 40;
    const sx = Math.min((W - 2 * pad) / (x1 - x0 || 1), (H - 2 * pad) / (y1 - y0 || 1));
    base = { sx, ox: W / 2 - sx * (x0 + x1) / 2, oy: H / 2 + sx * (y0 + y1) / 2 };
  }
  function fitView() { M.view = { k: 1, tx: 0, ty: 0 }; computeBase(); }
  function toScreen(p) {
    const { k, tx, ty } = M.view;
    return [k * (base.sx * p.x + base.ox) + tx, k * (-base.sx * p.y + base.oy) + ty];
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!M.points.length || !W) return;
    const surface = cssv("--panel"), faint = cssv("--point"), ink = cssv("--ink");
    ctx.fillStyle = surface; ctx.fillRect(0, 0, W, H);
    const focus = M.highlight.length > 0 || !!M.query;
    const cd = coded();
    const byReview = M.colorBy === "review";
    const byMode = M.colorBy === "mode" && !!M.mode;
    const failColor = cssv("--fail");
    const lrank = (p) => (labelOf(p.id) === 1 ? 1 : 0);
    const REV = { reviewed: cssv("--m-reviewed"), sampled: cssv("--m-sampled"), pool: faint };
    const RANK = { pool: 0, sampled: 1, reviewed: 2 };

    const layers = [[], []];
    for (const p of M.points) {
      const on = matches(p) && (!M.highlight.length || M.highlight.includes(p.cluster));
      layers[focus && !on ? 0 : 1].push(p);
    }
    layers.forEach((pts, li) => {
      ctx.globalAlpha = li === 0 ? 0.22 : 1;
      // In review coloring the traces that count are drawn last, on top.
      const order = byReview ? [...pts].sort((a, b) => RANK[statusOf(a.id, cd)] - RANK[statusOf(b.id, cd)])
        : byMode ? [...pts].sort((a, b) => lrank(a) - lrank(b)) : pts;
      for (const p of order) {
        const [x, y] = toScreen(p);
        if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
        const st = statusOf(p.id, cd);
        const lab = byMode ? labelOf(p.id) : null;
        // Mode coloring shows failures only: a fail is colored and larger,
        // and a pass looks the same as an unlabeled trace.
        const color = byReview ? REV[st] : byMode ? (lab === 1 ? failColor : faint) : (slotOf(p.cluster) || faint);
        const r = byReview ? (st === "pool" ? 3.5 : 4.5) : byMode ? (lab === 1 ? 5.5 : 3.5) : 4.5;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        if (p.cluster === -1 && !byReview && !byMode) {
          ctx.lineWidth = 1.5; ctx.strokeStyle = faint; ctx.stroke();
        } else {
          ctx.fillStyle = color; ctx.fill();
          ctx.lineWidth = 1.5; ctx.strokeStyle = surface; ctx.stroke();
        }
      }
    });
    ctx.globalAlpha = 1;
    drawRefs(focus);
    drawNumbers(focus);

    const current = (cur() || {}).trace_id;
    const cp = current && M.byId.get(current);
    if (cp) {
      const [x, y] = toScreen(cp);
      ctx.save(); ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.lineWidth = 1.2; ctx.strokeStyle = cssv("--ink"); ctx.stroke(); ctx.restore();
    }
    for (const [id, r, w] of [[M.hover, 7, 1.5], [M.selected, 8, 2.5]]) {
      const p = id && M.byId.get(id);
      if (!p) continue;
      const [x, y] = toScreen(p);
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.lineWidth = w; ctx.strokeStyle = ink; ctx.stroke();
    }
    for (const [id, w] of [[M.hoverRef, 1.5], [M.selectedRef, 2.5]]) {
      const r = id && M.refById.get(id);
      if (!r || !M.refKinds.has(r.kind)) continue;
      const [x, y] = toScreen(r);
      ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.lineWidth = w; ctx.strokeStyle = ink; ctx.stroke();
    }
    renderLegend(cd);
  }

  // One hollow shape per kind, so kind never rests on color: policies are
  // squares, stores diamonds, tools triangles, spec items crosses.
  function shapePath(kind, x, y, r) {
    ctx.beginPath();
    if (kind === "policy") ctx.rect(x - r, y - r, 2 * r, 2 * r);
    else if (kind === "store") { ctx.moveTo(x, y - r * 1.3); ctx.lineTo(x + r * 1.3, y); ctx.lineTo(x, y + r * 1.3); ctx.lineTo(x - r * 1.3, y); ctx.closePath(); }
    else if (kind === "tool") { ctx.moveTo(x, y - r * 1.3); ctx.lineTo(x + r * 1.2, y + r); ctx.lineTo(x - r * 1.2, y + r); ctx.closePath(); }
    else { ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r); ctx.lineTo(x, y + r); }
  }
  function drawRefs(focus) {
    const ink = cssv("--ink"), surface = cssv("--panel");
    for (const r of M.refs) {
      if (!M.refKinds.has(r.kind)) continue;
      const [x, y] = toScreen(r);
      if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
      ctx.globalAlpha = (M.query && !refMatches(r)) || (focus && !M.query) ? 0.35 : 0.95;
      shapePath(r.kind, x, y, 4.5);
      ctx.fillStyle = surface; if (r.kind !== "spec") ctx.fill();
      ctx.lineWidth = r.kind === "spec" ? 2 : 1.5; ctx.strokeStyle = ink; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  function shapeSVG(kind) {
    const d = {
      policy: '<rect x="1.5" y="1.5" width="7" height="7"/>',
      store: '<path d="M5 0.5 L9.5 5 L5 9.5 L0.5 5 Z"/>',
      tool: '<path d="M5 0.8 L9.3 8.7 L0.7 8.7 Z"/>',
      spec: '<path d="M1 5 H9 M5 1 V9" stroke-width="1.8"/>',
    }[kind];
    return `<svg class="shape" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3">${d}</svg>`;
  }
  // One switch for all reference items: policies, stores, tools and spec items
  // are drawn as hollow shapes, which crowd the map when always on.
  function renderKinds() {
    el("kinds").innerHTML = M.refs.length
      ? `<label title="Policies, stores, tools and spec items, embedded but not clustered"><input type="checkbox" id="tm-refs"
          ${M.refKinds.size ? "checked" : ""}> reference items</label>` : "";
  }
  el("kinds").addEventListener("change", (e) => {
    if (e.target.id !== "tm-refs") return;
    M.refKinds = e.target.checked ? new Set(Object.keys(KIND_LABEL)) : new Set();
    fitView(); draw();
  });

  function drawNumbers(focus) {
    M.badges = [];
    ctx.font = "600 11px system-ui, -apple-system, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // By default only the clusters in play get a badge: the highlighted ones,
    // the one on show in the pane, and the one under the pointer. Fifteen
    // boxed numbers pile up in the dense middle of the map.
    const hoverC = M.hover && M.byId.get(M.hover)?.cluster;
    const want = el("numbers").checked ? null
      : new Set([...M.highlight, M.pane === "cluster" ? M.paneCluster : null, hoverC].filter((c) => c != null && c !== -1));
    for (const c of M.run.clusters || []) {
      if (want && !want.has(c.cluster)) continue;
      const members = c.members.map((m) => M.byId.get(m)).filter(Boolean);
      if (!members.length) continue;
      // Sit the badge just above the cluster: a tight UMAP cluster can be
      // smaller than the badge and would vanish under it.
      const screen = members.map(toScreen);
      const x = screen.reduce((s, [px]) => s + px, 0) / screen.length;
      const y = Math.min(...screen.map(([, py]) => py)) - 15;
      const text = "#" + c.cluster;
      const w = ctx.measureText(text).width + 8;
      M.badges.push({ c: c.cluster, x: x - w / 2, y: y - 8, w, h: 16 });
      ctx.globalAlpha = focus && !M.highlight.includes(c.cluster) ? 0.35 : 0.95;
      ctx.fillStyle = cssv("--panel"); ctx.strokeStyle = cssv("--line"); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(x - w / 2, y - 8, w, 16, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = cssv("--ink"); ctx.fillText(text, x, y + 0.5);
    }
    ctx.globalAlpha = 1;
  }

  function renderLegend(cd) {
    const items = [];
    if (M.colorBy === "review") {
      const n = { reviewed: 0, sampled: 0, pool: 0 };
      M.points.forEach((p) => n[statusOf(p.id, cd)]++);
      items.push(`<span><i style="background:${cssv("--m-reviewed")}"></i>coded (${n.reviewed})</span>`);
      items.push(`<span><i style="background:${cssv("--m-sampled")}"></i>sampled, not coded (${n.sampled})</span>`);
      items.push(`<span><i style="background:${cssv("--point")};width:7px;height:7px"></i>rest of pool (${n.pool})</span>`);
    } else if (M.colorBy === "mode" && M.mode) {
      const f = M.points.filter((p) => labelOf(p.id) === 1).length;
      items.push(`<span class="mono">${esc(M.mode)}</span>`);
      items.push(`<span><i style="background:${cssv("--fail")};width:11px;height:11px"></i>fail (${f})</span>`);
      items.push(`<span><i style="background:${cssv("--point")};width:7px;height:7px"></i>pass or not labeled (${M.points.length - f})</span>`);
    } else {
      M.highlight.forEach((c, i) => items.push(
        `<span><i style="background:${cssv(SLOT_VARS[i])}"></i>#${c} (${M.clusterById.get(c)?.size ?? 0})</span>`));
      items.push(`<span><i style="background:${cssv("--point")}"></i>${M.highlight.length ? "other clusters" : "clustered"}</span>`);
      items.push(`<span><i class="ring"></i>unclustered</span>`);
    }
    if (M.byId.has((cur() || {}).trace_id)) items.push(`<span><i class="cur"></i>current trace</span>`);
    for (const k of Object.keys(KIND_LABEL)) {
      if (M.refKinds.has(k) && M.refs.some((r) => r.kind === k)) items.push(`<span>${shapeSVG(k)}${KIND_LABEL[k]}</span>`);
    }
    if (M.query) {
      const n = M.points.filter(matches).length;
      items.push(`<span>“${esc(M.query)}”: ${n} match${n === 1 ? "" : "es"}</span>`);
    }
    el("legend").innerHTML = items.join("");
  }

  // ------------------------------------------------------------ hit testing
  function badgeAt(mx, my) {
    for (let i = M.badges.length - 1; i >= 0; i--) {
      const b = M.badges[i];
      if (mx >= b.x - 3 && mx <= b.x + b.w + 3 && my >= b.y - 3 && my <= b.y + b.h + 3) return b.c;
    }
    return null;
  }
  function nearest(mx, my) {
    let best = null, bd = 12 * 12;
    for (const p of M.points) {
      const [x, y] = toScreen(p);
      const d = (x - mx) ** 2 + (y - my) ** 2;
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }
  function nearestRef(mx, my) {
    let best = null, bd = 12 * 12;
    for (const r of M.refs) {
      if (!M.refKinds.has(r.kind)) continue;
      const [x, y] = toScreen(r);
      const d = (x - mx) ** 2 + (y - my) ** 2;
      if (d < bd) { bd = d; best = r; }
    }
    return best && { ref: best, d: bd };
  }
  const distSq = (p, mx, my) => { const [x, y] = toScreen(p); return (x - mx) ** 2 + (y - my) ** 2; };
  function markAt(mx, my) {
    const p = nearest(mx, my), r = nearestRef(mx, my);
    if (r && (!p || r.d <= distSq(p, mx, my))) return { ref: r.ref };
    return p ? { trace: p } : null;
  }

  let drag = null;
  canvas.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, tx: M.view.tx, ty: M.view.ty, moved: false };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; canvas.classList.add("drag"); }
      if (drag.moved) { M.view.tx = drag.tx + dx; M.view.ty = drag.ty + dy; hideTip(); draw(); return; }
    }
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const badge = badgeAt(mx, my);
    const mark = badge === null ? markAt(mx, my) : null;
    const p = mark?.trace || null, ref = mark?.ref || null;
    canvas.style.cursor = badge !== null || mark ? "pointer" : "";
    if ((p && p.id) !== M.hover || (ref && ref.id) !== M.hoverRef) {
      M.hover = p && p.id; M.hoverRef = ref && ref.id; draw();
    }
    if (badge !== null) showClusterTip(badge, mx, my);
    else if (ref) showRefTip(ref, mx, my);
    else if (p) showTip(p, mx, my);
    else hideTip();
  });
  canvas.addEventListener("pointerup", (e) => {
    canvas.classList.remove("drag");
    const moved = drag && drag.moved;
    drag = null;
    if (moved) return;
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const badge = badgeAt(mx, my);
    if (badge !== null) { selectCluster(badge, { toggle: true }); return; }
    const mark = markAt(mx, my);
    if (mark?.ref) { selectRef(mark.ref.id); return; }
    const p = mark?.trace;
    if (!p) return;
    if (e.shiftKey) selectCluster(p.cluster, { toggle: true });
    else select(p.id);
  });
  canvas.addEventListener("dblclick", (e) => {
    const r = canvas.getBoundingClientRect();
    const mark = markAt(e.clientX - r.left, e.clientY - r.top);
    if (mark?.trace) { hideTip(); openInReview(mark.trace.id); }
  });
  canvas.addEventListener("pointerleave", () => { if (!drag) { M.hover = null; M.hoverRef = null; hideTip(); draw(); } });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = Math.min(40, Math.max(0.5, M.view.k * Math.exp(-e.deltaY * 0.0015)));
    const g = k / M.view.k;
    M.view.tx = mx - g * (mx - M.view.tx);
    M.view.ty = my - g * (my - M.view.ty);
    M.view.k = k;
    draw();
  }, { passive: false });

  function placeTip(x, y) {
    const tip = el("tip");
    tip.style.display = "block";
    const wrap = el("wrap").getBoundingClientRect();
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(6, Math.min(x + 14, wrap.width - tw - 6)) + "px";
    tip.style.top = (y + 14 + th > wrap.height ? y - th - 10 : y + 14) + "px";
  }
  function showTip(p, x, y) {
    const c = p.cluster === -1 ? "unclustered" : `cluster #${p.cluster}`;
    const batch = S.batchOf[p.id];
    const n = notesFor(p.id).length;
    el("tip").innerHTML = `<div class="t">${esc(p.summary.title || p.id)}</div>
      <div class="muted">${esc(c)} · ${batch ? esc(batch) : "off-manifest"}${n ? ` · ${n} note${n > 1 ? "s" : ""}` : ""}
        · <span class="mono">${esc(p.id.slice(0, 8))}</span></div>
      ${p.summary.user_goal ? `<div>${esc(p.summary.user_goal)}</div>` : ""}`;
    placeTip(x, y);
  }
  function showClusterTip(c, x, y) {
    const cl = M.clusterById.get(c), d = describedOf(c);
    el("tip").innerHTML = `<div class="t">#${c} · ${esc(d?.title || cl?.label || "")}</div>
      <div class="muted">${cl?.size ?? 0} traces · click to select</div>
      ${d?.summary ? `<div>${esc(d.summary)}</div>` : ""}`;
    placeTip(x, y);
  }
  function showRefTip(r, x, y) {
    el("tip").innerHTML = `<div class="t">${shapeSVG(r.kind)} ${esc(r.name)}</div>
      <div class="muted">${esc(r.kind)} · embedded, not clustered · click for nearest traces</div>
      <div>${esc(r.text.length > 220 ? r.text.slice(0, 219) + "…" : r.text)}</div>`;
    placeTip(x, y);
  }
  function hideTip() { el("tip").style.display = "none"; }

  // ------------------------------------------------------------ detail pane
  function selectRef(id) {
    M.selectedRef = id; M.pane = "ref";
    // Opening one reference item turns them all on, so it is visible in place.
    if (M.refById.has(id) && !M.refKinds.size) { M.refKinds = new Set(Object.keys(KIND_LABEL)); fitView(); }
    renderKinds(); renderDetail(); draw();
  }
  function select(id) {
    M.selected = id; M.pane = "trace";
    const p = M.byId.get(id);
    if (p) M.open = p.cluster;
    renderClusters(); renderDetail(); draw();
    root.querySelector(".cl.on")?.scrollIntoView({ block: "nearest" });
  }

  function stepHTML(s, prior) {
    const cls = `tstep ${esc(s.role)}${prior ? " prior" : ""}`;
    if (s.role === "user" || s.role === "assistant") {
      return `<div class="${cls}"><div class="who">${esc(s.role)}</div><div class="txt">${esc(s.text)}</div></div>`;
    }
    if (s.role === "tool_call") {
      return `<div class="${cls}"><div class="who">tool call · ${esc(s.name)}</div>
        <pre>${esc(JSON.stringify(s.arguments ?? {}, null, 1))}</pre></div>`;
    }
    if (s.role === "tool_result") {
      const c = s.content;
      const bad = c && typeof c === "object" && (c.ok === false || c.error);
      const json = JSON.stringify(c, null, 1) ?? "";
      const body = json.length > 400
        ? `<details><summary>${esc(json.slice(0, 90))}…</summary><pre>${esc(json)}</pre></details>`
        : `<pre>${esc(json)}</pre>`;
      return `<div class="${cls}${bad ? " bad" : ""}"><div class="who">tool result · ${esc(s.name)}</div>${body}</div>`;
    }
    return `<div class="${cls}"><div class="who">${esc(s.role)}</div><pre>${esc(JSON.stringify(s, null, 1))}</pre></div>`;
  }

  function toolCounts(ids) {
    const out = new Map();
    for (const id of ids) {
      const p = M.byId.get(id);
      for (const name of new Set((p?.summary.tool_activity || []).map((t) => t.name))) out.set(name, (out.get(name) || 0) + 1);
    }
    return out;
  }
  function roleCounts(ids) {
    const out = new Map();
    for (const id of ids) {
      const role = S.byId[id]?.langfuse?.user_role || "unknown";
      out.set(role, (out.get(role) || 0) + 1);
    }
    return out;
  }
  // How much a yes/no feature tells you about membership: the KL divergence
  // between its rate in the cluster (p) and across all traces (q), in bits.
  function informative(p, q) {
    const term = (a, b) => (a > 0 ? a * Math.log2(a / b) : 0);
    if (q <= 0 || q >= 1) return 0;
    return term(p, q) + term(1 - p, 1 - q);
  }
  function compareHTML(mine, n, all, total, color) {
    const rows = [...all.keys()].map((k) => {
      const a = (mine.get(k) || 0) / n, b = all.get(k) / total;
      return { k, a, b, c: mine.get(k) || 0, info: informative(a, b) };
    }).sort((x, y) => y.info - x.info || y.a - x.a);
    const fill = color ? `background:${color}` : "";
    return `<div class="cmp"><span></span><span></span><span class="hd">here</span><span class="hd">all</span>` +
      rows.map((r) => {
        const lift = r.b ? (r.a / r.b).toFixed(1) + "×" : "–";
        const title = `${r.c} of ${n} traces here (${pct(r.a)}) vs ${all.get(r.k)} of ${total} overall (${pct(r.b)}); ${lift}; ${r.info.toFixed(2)} bits`;
        const dir = r.info < 0.005 ? "" : r.a > r.b ? "↑" : "↓";
        return `<span class="k" title="${esc(title)}"><span class="dir">${dir}</span>${esc(r.k)}</span>
          <span class="track" title="${esc(title)}"><span class="fill" style="width:${(100 * r.a).toFixed(1)}%;${fill}"></span>
            <span class="tick" style="left:${(100 * r.b).toFixed(1)}%"></span></span>
          <span class="v">${pct(r.a)}</span><span class="v all">${pct(r.b)}</span>`;
      }).join("") + `</div>`;
  }
  function cmpKey(color, total) {
    return `<div class="cmpkey"><span><i style="${color ? `background:${color}` : ""}"></i>this cluster</span>
      <span><b></b>all ${total} traces</span><span>↑ ↓ more or less than overall</span></div>`;
  }
  function barsHTML(items, size, color) {
    if (!items?.length) return `<p class="faint small">none</p>`;
    return `<div class="bars">` + items.map((i) => `
      <span class="k">${esc(i.value)}</span>
      <span class="track"><span class="fill" style="width:${(100 * i.count / size).toFixed(1)}%;${color ? `background:${color}` : ""}"></span></span>
      <span class="v">${i.count}/${size}</span>`).join("") + `</div>`;
  }

  function renderClusterPane(box) {
    const c = M.paneCluster;
    const cl = c === -1
      ? { cluster: -1, label: "", size: (M.run.unclustered || []).length, representatives: [], members: M.run.unclustered || [] }
      : M.clusterById.get(c);
    if (!cl) { box.innerHTML = INTRO; return; }
    const d = describedOf(c), prof = d?.profile, color = slotOf(c);
    const cd = coded();
    const smp = cl.members.filter((m) => S.batchOf[m]).length;
    const rev = cl.members.filter((m) => cd.has(m)).length;
    const name = c === -1 ? "Unclustered traces" : (d?.title || cl.label);
    const pills = [
      c === -1 ? "" : `<span class="pill">cluster #${c}</span>`,
      `<span class="pill">${cl.size} traces</span>`,
      `<span class="pill" title="drawn into the review sample">${smp} sampled</span>`,
      `<span class="pill" title="with at least one note">${rev} coded</span>`,
      prof?.multi_turn ? `<span class="pill">${prof.multi_turn} in multi-turn sessions</span>` : "",
      d?.source ? `<span class="pill" title="who wrote the summary">${esc(d.source)}</span>` : "",
    ].join("");
    let html = `<div class="title">${esc(name)}</div><div class="pills">${pills}</div>`;
    if (c === -1) {
      html += `<p class="muted">HDBSCAN left these out of every cluster. No group explains them,
        so each is worth a look on its own.</p>`;
    } else {
      if (d?.summary) html += `<p class="kv">${esc(d.summary)}</p>`;
      const allIds = M.points.map((p) => p.id), total = allIds.length;
      html += `<h4>Tools that ran <span class="aside">· most distinctive first</span></h4>`;
      html += cmpKey(color, total) + compareHTML(toolCounts(cl.members), cl.size, toolCounts(allIds), total, color);
      html += `<h4>User roles <span class="aside">· most distinctive first</span></h4>`;
      html += compareHTML(roleCounts(cl.members), cl.size, roleCounts(allIds), total, color);
      if (prof) html += `<h4>Notable results</h4>` + barsHTML(prof.results, prof.size, color);
      html += `<h4>Keyword label</h4><p class="faint small">${esc(cl.label)}</p>`;
    }
    const reps = new Set(cl.representatives);
    const order = [...cl.representatives, ...cl.members.filter((m) => !reps.has(m))];
    html += `<h4>Traces${reps.size ? ` <span class="aside">· nearest the centre first</span>` : ""}</h4>`;
    html += `<div class="memberlist">` + order.map((m) => {
      const p = M.byId.get(m);
      if (!p) return "";
      const st = statusOf(m, cd);
      const mark = st === "reviewed" ? `<span class="st" style="color:var(--m-reviewed)">●</span>`
        : st === "sampled" ? `<span class="st" style="color:var(--m-sampled)">●</span>` : "";
      return `<a href="#" data-t="${esc(m)}">${reps.has(m) ? `<span class="rep">REP</span>` : ""}${mark}${esc(p.summary.title || m)}
        ${p.summary.user_goal ? `<span class="g">${esc(p.summary.user_goal)}</span>` : ""}</a>`;
    }).join("") + `</div>`;
    html += `<div class="note">Cluster summaries describe what the traces share. They do not say
      which ones failed. Read the conversations before naming a failure.</div>`;
    box.innerHTML = html; box.scrollTop = 0;
  }

  function traceLinkHTML(tid, score) {
    const p = M.byId.get(tid);
    if (!p) return "";
    const cl = p.cluster === -1 ? "–" : "#" + p.cluster;
    return `<a href="#" data-t="${esc(tid)}"><span class="faint mono">${cl}</span>
      <span>${esc(p.summary.title || tid)}</span><span class="score">${score.toFixed(2)}</span></a>`;
  }
  function renderRefPane(box) {
    const r = M.refById.get(M.selectedRef);
    if (!r) { box.innerHTML = INTRO; return; }
    let html = `<div class="title">${shapeSVG(r.kind)} ${esc(r.name)}</div>
      <div class="pills"><span class="pill">${esc(r.kind)}</span><span class="pill mono">${esc(r.id)}</span>
      <span class="pill" title="Placed into the layout with UMAP's transform; not part of any cluster">not clustered</span></div>`;
    html += `<div class="reftext">${esc(r.text)}</div>`;
    html += `<h4>Nearest traces <span class="aside">· cosine similarity of embeddings</span></h4>`;
    html += `<div class="reflist">` + (r.nearest || []).map(([tid, sc]) => traceLinkHTML(tid, sc)).join("") + `</div>`;
    html += `<div class="note">Nearness means similar wording, not that a trace applied or broke this
      item. Read the conversation before drawing that conclusion.</div>`;
    box.innerHTML = html; box.scrollTop = 0;
  }

  function renderDetail() {
    const box = el("detail");
    if (!M.run) return;
    if (M.pane === "cluster") { renderClusterPane(box); return; }
    if (M.pane === "ref") { renderRefPane(box); return; }
    const p = M.pane === "trace" && M.selected && M.byId.get(M.selected);
    if (!p) { box.innerHTML = INTRO; return; }
    const s = p.summary, rec = S.byId[p.id], sess = rec?.session || {};
    const cl = p.cluster === -1 ? "unclustered" : `cluster #${p.cluster}`;
    const batch = S.batchOf[p.id], n = notesFor(p.id).length;
    const pills = [
      `<span class="pill link" data-c="${p.cluster}" title="Show this cluster">${esc(cl)} ›</span>`,
      batch ? `<span class="pill batch">${esc(batch)}</span>` : `<span class="pill off">off-manifest</span>`,
      n ? `<span class="pill">${n} note${n > 1 ? "s" : ""}</span>` : "",
      ...S.modes.filter((m) => (S.labels[m.name] || {})[p.id]?.label === 1)
        .map((m) => `<span class="pill fail" title="labelled Fail">${esc(m.name)}</span>`),
      `<span class="pill${/llm/.test(p.source || "") ? " live" : ""}">summary: ${esc(p.source || "?")}</span>`,
      rec?.langfuse?.user_role ? `<span class="pill">${esc(rec.langfuse.user_role)}</span>` : "",
      sess.turn_count > 1 ? `<span class="pill">turn ${sess.turn_index + 1} of ${sess.turn_count}</span>` : "",
      `<span class="pill mono" title="trace id">${esc(p.id.slice(0, 12))}</span>`,
    ].join("");
    let html = `<div class="title">${esc(s.title || p.id)}</div><div class="pills">${pills}</div>`;
    if (rec) html += `<button class="openrev" data-open="${esc(p.id)}">Open in Review ›</button>`;
    html += `<h4>Summary <span class="aside">· what was embedded</span></h4>`;
    if (s.user_goal) html += `<p class="kv"><span class="muted">Goal.</span> ${esc(s.user_goal)}</p>`;
    if (s.flow?.length) html += `<ul class="tight">${s.flow.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>`;
    if (s.tool_activity?.length) {
      html += `<ul class="tight">${s.tool_activity.map((t) =>
        `<li class="tool">${esc(t.name)}(${esc(t.arguments)})${t.result ? ` <span class="arrow">→</span> ${esc(t.result)}` : ""}</li>`).join("")}</ul>`;
    }
    if (s.outcome) html += `<p class="kv"><span class="muted">Outcome.</span> ${esc(s.outcome)}</p>`;
    if (s.notable?.length) html += `<ul class="tight">${s.notable.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
    const near = M.run.traces[p.id]?.nearest_refs || [];
    if (near.length) {
      html += `<h4>Nearest reference items <span class="aside">· by wording, not a verdict</span></h4>`;
      html += `<div class="reflist">` + near.map(([rid, sc]) => {
        const r = M.refById.get(rid);
        return r ? `<a href="#" data-r="${esc(rid)}">${shapeSVG(r.kind)}<span>${esc(r.name)}</span><span class="score">${sc.toFixed(2)}</span></a>` : "";
      }).join("") + `</div>`;
    }
    html += `<h4>Conversation</h4>`;
    if (!rec) {
      html += `<p class="muted">This trace is not in the review pool, so its steps are not available here.</p>`;
    } else {
      const prior = sess.prior_trace_ids || [];
      prior.forEach((pid, i) => {
        html += `<div class="turnsep">turn ${i + 1} (earlier)</div>`;
        const pr = S.byId[pid];
        html += pr ? pr.steps.map((st) => stepHTML(st, true)).join("")
          : `<p class="faint small">Earlier turn ${esc(pid.slice(0, 8))} is not in the pool.</p>`;
      });
      if (prior.length) html += `<div class="turnsep">turn ${prior.length + 1} (this trace)</div>`;
      html += rec.steps.map((st) => stepHTML(st, false)).join("");
    }
    html += `<div class="note">Clusters are a sampling aid: they say which traces resemble each
      other, not which ones failed. Read the conversation before naming a failure.</div>`;
    box.innerHTML = html; box.scrollTop = 0;
  }

  el("detail").addEventListener("click", (e) => {
    const open = e.target.closest("button[data-open]");
    if (open) { openInReview(open.dataset.open); return; }
    const link = e.target.closest("a[data-t]");
    if (link) { e.preventDefault(); select(link.dataset.t); return; }
    const refLink = e.target.closest("a[data-r]");
    if (refLink) { e.preventDefault(); selectRef(refLink.dataset.r); return; }
    const pill = e.target.closest(".pill.link[data-c]");
    if (pill) selectCluster(Number(pill.dataset.c));
  });
  el("search").addEventListener("input", (e) => {
    M.query = e.target.value.trim().toLowerCase();
    renderClusters(); draw();
  });
  el("numbers").addEventListener("change", draw);
  el("reset").addEventListener("click", () => { fitView(); draw(); });
  el("clear").addEventListener("click", clearAll);
  function setColor(by) {
    M.colorBy = by;
    ["cluster", "review", "mode"].forEach((k) => el("by-" + k).classList.toggle("on", by === k));
    el("mode").hidden = by !== "mode";
    if (by === "mode") { renderModes(); if (!M.mode && S.modes.length) M.mode = S.modes[0].name; el("mode").value = M.mode || ""; }
    renderClusters(); draw();
  }
  // Options follow the live taxonomy, each with its current fail count.
  function renderModes() {
    el("mode").innerHTML = S.modes.length ? S.modes.map((m) => {
      const f = Object.values(S.labels[m.name] || {}).filter((r) => r.label === 1).length;
      return `<option value="${esc(m.name)}">${esc(m.name)} (${f} fail)</option>`;
    }).join("") : `<option value="">no modes yet</option>`;
    if (M.mode && !S.modes.some((m) => m.name === M.mode)) M.mode = null;
  }
  el("by-cluster").addEventListener("click", () => setColor("cluster"));
  el("by-review").addEventListener("click", () => setColor("review"));
  el("by-mode").addEventListener("click", () => setColor("mode"));
  el("mode").addEventListener("change", (e) => { M.mode = e.target.value || null; renderClusters(); draw(); });
  function clearAll() {
    M.highlight = []; M.query = ""; el("search").value = "";
    if (M.pane === "cluster" || M.pane === "ref") M.pane = M.selected ? "trace" : "intro";
    M.selectedRef = null; M.open = null;
    renderClusters(); renderDetail(); draw();
  }
  // Esc and 0 only while the map is showing; every other key keeps its
  // app-wide meaning (digits still label, / still jumps to Reference).
  document.addEventListener("keydown", (e) => {
    if (S.view !== "map" || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if ($("#help").classList.contains("open")) return;
    if (e.key === "Escape") clearAll();
    else if (e.key === "0") { fitView(); draw(); }
  });
  new ResizeObserver(() => { if (S.view === "map") resize(); }).observe(el("wrap"));

  return {
    load, show, empty,
    loaded: () => !!M.run,
    // Review state changes (a note, a new batch) repaint without refetching.
    refresh: () => { if (M.run && S.view === "map") { if (M.colorBy === "mode") renderModes(), (el("mode").value = M.mode || ""); renderClusters(); draw(); } },
  };
})();

// ---------------------------------------------------------------- events
$("#prev").onclick = () => { if (S.idx > 0) { S.idx--; render(); } };
$("#next").onclick = () => { if (S.idx < visible().length - 1) { S.idx++; render(); } };
$("#filter").onchange = (e) => { S.filter = e.target.value; S.idx = 0; render(); };
$("#tab-review").onclick = () => { S.view = "review"; render(); };
$("#tab-tax").onclick = () => { S.view = "tax"; render(); };
$("#tab-label").onclick = () => { S.view = "label"; render(); };
$("#tab-map").onclick = () => { S.view = "map"; render(); };
$("#new-mode").onclick = () => newMode();
$("#new-mode-name").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); newMode(); }
});
$("#pane-code-btn").onclick = () => setPane("code");
$("#pane-label-btn").onclick = () => setPane("label");

// Left-column sections remember whether they were open.
["scen", "facts", "spec"].forEach((k) => {
  const d = $("#sec-" + k);
  d.open = pref("sec-" + k, "1") === "1";
  d.addEventListener("toggle", () => setPref("sec-" + k, d.open ? "1" : "0"));
});

// ---------------------------------------------------------------- theme
// auto follows the OS; light and dark pin it. The map is a canvas painted from
// the CSS tokens, so it has to be redrawn when they change.
const THEMES = { auto: "◐ auto", light: "☀ light", dark: "☾ dark" };
function applyTheme(th) {
  if (th === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", th);
  $("#themebtn").textContent = THEMES[th];
  $("#themebtn").dataset.theme = th;
  if (S.view === "map") render();
}
$("#themebtn").onclick = () => {
  const keys = Object.keys(THEMES);
  const next = keys[(keys.indexOf($("#themebtn").dataset.theme) + 1) % keys.length];
  setPref("theme", next); applyTheme(next);
};
try {
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
    if ($("#themebtn").dataset.theme === "auto" && S.view === "map") render();
  });
} catch (e) { /* older browsers: the page still follows the OS on reload */ }
applyTheme(THEMES[pref("theme", "auto")] ? pref("theme", "auto") : "auto");

$("#note-save").onclick = () => {
  const v = $("#note-in").value.trim();
  if (v) addNote(v, $("#note-in").dataset.anchor);
};
$("#note-clean").onclick = () => addNote("no failure observed", null);

// ---------------------------------------------------------------- shortcuts
// One table drives both the bindings and the help overlay, so the two cannot
// drift. (The reference interface documents annotation fields `start`/`end`
// that its own code never writes — the same drift, one layer down.)
//
// Entries with `run` are dispatched on keydown. Entries without it are keys
// handled closer to their widget (the popover's own listener, the textarea's
// save) and appear in the help for completeness.
const SHORTCUTS = [
  { group: "Move", key: "j", label: "next trace", run: () => $("#next").click() },
  { group: "Move", key: "k", label: "previous trace", run: () => $("#prev").click() },
  { group: "Move", key: "r", label: "back to Review",
    run: () => { S.view = "review"; render(); } },
  { group: "Move", key: "m", label: "Map: clusters and coverage",
    run: () => { S.view = "map"; render(); } },
  { group: "Move", key: "g", label: "Labeling: progress and the trace × mode grid",
    run: () => { S.view = "label"; render(); } },

  { group: "Open coding", key: "t", label: "cycle tool and interim-message detail: compact, full, off",
    run: () => cycleTools(),
    note: "interim = an assistant message before the turn's final reply, which the user never sees; “off” hides every interim message but keeps a tool step a note is anchored to" },
  { group: "Open coding", key: "o", label: "show the open-code panel",
    run: () => setPane("code") },
  { group: "Open coding", key: "n", label: "focus the open-code box",
    run: () => { setPane("code"); $("#note-in").focus(); },
    note: "describe the first failure in your own words, then stop; no mode names yet" },
  { group: "Open coding", key: "x", label: "record “no failure observed”",
    run: () => $("#note-clean").click() },
  { group: "Open coding", key: "drag", label: "select text in the conversation",
    note: "opens a note anchored to that exact span" },
  { group: "Open coding", key: "⌘ ↩", label: "save the note you are typing" },
  { group: "Open coding", key: "esc", label: "cancel the selection popover" },

  { group: "Labeling", key: "l", label: "show the labels panel",
    run: () => setPane("label") },
  { group: "Labeling", key: "1…9", label: "mark mode N as Fail", modes: true },
  { group: "Labeling", key: "⇧1…9", label: "mark mode N as Pass",
    note: "every trace gets one judgment per mode" },

  { group: "Evidence", key: "green", label: "spec item attached from tool activity" },
  { group: "Evidence", key: "purple", label: "spec item suggested by a model",
    note: "both point at what to check; neither is a verdict" },
  { group: "Evidence", key: "AI", label: "suggestions are proposals from a search, not labels",
    note: "accepting one records it as your own open code" },

  { group: "Map", key: "click", label: "read a trace, or a cluster's profile" },
  { group: "Map", key: "dbl-click", label: "open the trace in Review" },
  { group: "Map", key: "⇧ click", label: "select a point's cluster (up to three are colored)" },
  { group: "Map", key: "drag", label: "pan; scroll to zoom" },
  { group: "Map", key: "0", label: "reset zoom" },
  { group: "Map", key: "esc", label: "clear highlights" },

  { group: "Help", key: "?", label: "show or hide this list", run: () => toggleHelp() },
];

const BY_KEY = {};
SHORTCUTS.forEach((s) => { if (s.run) BY_KEY[s.key] = s; });

function toggleHelp(force) {
  const el = $("#help");
  const open = force === undefined ? !el.classList.contains("open") : force;
  el.classList.toggle("open", open);
  if (open) renderHelp();
}

function renderHelp() {
  const groups = [];
  SHORTCUTS.forEach((s) => {
    let g = groups.find((x) => x.name === s.group);
    if (!g) groups.push((g = { name: s.group, rows: [] }));
    g.rows.push(s);
  });
  $("#help-body").innerHTML = groups.map((g) => `
    <div class="grp">${esc(g.name)}</div>
    ${g.rows.map((s) => `
      <div class="row">
        <kbd>${esc(s.key)}</kbd>
        <span class="desc">${esc(s.label)}</span>
        ${s.note ? `<span class="tip">${esc(s.note)}</span>` : ""}
      </div>
      ${s.modes ? modeLegend() : ""}
    `).join("")}`).join("");
}

// The digit bindings are positional, so N means whatever sits Nth in the
// taxonomy today. Spelling out the current mapping keeps a reordered
// patterns.json from silently repointing the keys under the reviewer.
function modeLegend() {
  if (!S.modes.length) {
    return `<div class="modes">No modes defined yet &mdash; these keys do nothing until the taxonomy has entries.</div>`;
  }
  return `<div class="modes">${S.modes.slice(0, 9).map((m, i) =>
    `<kbd>${i + 1}</kbd> <code>${esc(m.name)}</code>`).join(" &nbsp; ")}</div>`;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#help").classList.contains("open")) {
    toggleHelp(false); return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (typing) {
    // Cmd/Ctrl+Enter saves without leaving the textarea.
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault(); $("#note-save").click();
    }
    return;
  }
  // A modifier means the key belongs to the browser, not to us.
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  const hit = BY_KEY[e.key];
  if (hit) { e.preventDefault(); hit.run(); return; }

  // e.code, not e.key: with Shift held, e.key for the "1" key is "!" on a US
  // layout, so a range test on e.key never matches and the Pass binding is
  // dead. The physical key code is stable under Shift and across layouts.
  const digit = /^Digit([1-9])$/.exec(e.code);
  if (digit) {
    const m = S.modes[+digit[1] - 1];
    if (m) { e.preventDefault(); setPane("label"); setLabel(m.name, e.shiftKey ? 0 : 1); }
    else toast("no mode in slot " + digit[1]);
  }
});

$("#toolbtn").onclick = () => cycleTools();
$("#helpbtn").onclick = () => toggleHelp();
$("#help").onclick = (e) => { if (e.target.id === "help") toggleHelp(false); };

// A #trace=<id> link opens that trace in the review view (a unique prefix
// works); #batch=<name> opens a batch or worklist in the filter.
function openFromHash() {
  const list = /^#batch=(.+)$/.exec(location.hash);
  if (list) {
    const name = decodeURIComponent(list[1]);
    if (!S.manifest.batches.some((b) => b.name === name)) { toast(`no batch ${name}`); return; }
    S.filter = "batch:" + name; $("#filter").value = S.filter;
    S.idx = 0; S.view = "review"; render();
    return;
  }
  const m = /^#trace=([0-9a-f]+)$/i.exec(location.hash);
  if (!m) return;
  const hits = Object.keys(S.byId).filter((id) => id.startsWith(m[1].toLowerCase()));
  if (hits.length === 1) openInReview(hits[0]);
  else toast(hits.length ? `trace prefix ${m[1]} is ambiguous` : `no trace ${m[1]} in the pool`);
}
window.addEventListener("hashchange", openFromHash);

load().then(() => { openFromHash(); setInterval(poll, POLL_MS); }).catch((e) => {
  document.body.innerHTML =
    `<div style="padding:30px;font-family:var(--mono)">Failed to load: ${esc(e.message)}
     <br><br>Build the pool first:<br><code>uv run python -m analysis.review_app.traces</code></div>`;
});
</script>
</body>
