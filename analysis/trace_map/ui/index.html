<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartwheel trace map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='5' r='2.5' fill='%233987e5'/%3E%3Ccircle cx='11' cy='4' r='2.5' fill='%237d8598'/%3E%3Ccircle cx='9' cy='11' r='2.5' fill='%23d95926'/%3E%3C/svg%3E">
<style>
/* Surfaces and ink match analysis/review_app/ui so the two tools read as one.
   Highlight slots are the dataviz reference's first three dark categorical
   steps, validated all-pairs on --panel (#191c24): worst CVD dE 9.4. A scatter
   cannot give 15 clusters 15 hues, so clusters carry a number label above
   them and only the (at most three) clusters you pick get a color. */
:root {
  --bg: #12141a; --panel: #191c24; --panel2: #1f232d; --line: #2c313d;
  --ink: #e6e9f0; --dim: #949cb0; --faint: #6b7385;
  --user: #6ea8fe; --asst: #7ee0b8; --tool: #e0b96e; --err: #ef7a85;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --point: #7d8598; --grid: #232733;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.5 system-ui, -apple-system, sans-serif;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden;
}
button, select, input {
  font: inherit; color: var(--ink); background: var(--panel2);
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px;
}
button { cursor: pointer; }
button:hover { background: #2a2f3b; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: #35507d; border-color: #4a6ba8; }
input::placeholder { color: var(--faint); }
code, .mono { font-family: var(--mono); font-size: 12px; }

header {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 14px; margin: 0; font-weight: 600; }
#runmeta { flex: 1; min-width: 0; flex-wrap: nowrap; overflow: hidden; }
#runmeta .pill { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#search { width: 240px; flex: 0 0 auto; }
.pill {
  font-size: 11px; padding: 1px 7px; border-radius: 9px;
  border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
}
.pill.live { color: var(--tool); border-color: #6b5a30; }

main { flex: 1; display: grid; grid-template-columns: 290px 1fr 420px; min-height: 0; }
.col { overflow-y: auto; padding: 10px 12px; min-height: 0; }
.left { background: var(--panel); border-right: 1px solid var(--line); }
.right { background: var(--panel); border-left: 1px solid var(--line); }
h4 {
  margin: 14px 0 6px; font-size: 10px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--faint); font-weight: 600;
}
h4:first-child { margin-top: 0; }
.muted { color: var(--dim); }
.faint { color: var(--faint); }
.small { font-size: 11px; }


/* ---- cluster list ---- */
.cl {
  display: grid; grid-template-columns: 14px 26px 1fr auto; gap: 6px; align-items: start;
  padding: 5px 6px; border-radius: 5px; cursor: pointer; border: 1px solid transparent;
}
.cl:hover { background: var(--panel2); }
.cl.on { border-color: var(--line); background: var(--panel2); }
.cl .sw { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--point); }
.cl .sw.ring { background: transparent; border: 1.5px solid var(--point); }
.cl .num { font-family: var(--mono); color: var(--dim); font-size: 12px; }
.cl .lab { font-size: 12px; overflow-wrap: anywhere; }
.cl .n { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.members { margin: 2px 0 8px 46px; }
.members a {
  display: block; color: var(--ink); text-decoration: none; font-size: 12px;
  padding: 2px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.members a:hover { background: var(--panel2); }
.members a.sel { background: #2a3550; }
.members a .rep { color: var(--tool); font-size: 10px; margin-right: 4px; }

/* ---- map ---- */
.mapwrap { position: relative; min-width: 0; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.drag { cursor: grabbing; }
.maptools {
  position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; align-items: center;
}
.legend {
  position: absolute; bottom: 8px; left: 8px; display: flex; gap: 12px; flex-wrap: wrap;
  background: rgba(25,28,36,.9); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 9px; font-size: 11px; color: var(--dim); max-width: calc(100% - 16px);
}
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.legend i.ring { border: 1.5px solid var(--point); }
#tip {
  position: absolute; pointer-events: none; display: none; max-width: 320px;
  background: #0d0f14; border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.45); z-index: 3;
}
#tip .t { font-weight: 600; margin-bottom: 2px; }
.empty {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--dim); text-align: center; padding: 30px;
}

/* ---- detail ---- */
.title { font-size: 15px; font-weight: 600; margin: 0 0 6px; }
.pills { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.kv { margin: 0 0 6px; }
ul.tight { margin: 2px 0 6px; padding-left: 18px; }
ul.tight li { margin: 1px 0; }
.tool { font-family: var(--mono); font-size: 11.5px; overflow-wrap: anywhere; }
.tool .arrow { color: var(--faint); }
.turnsep {
  display: flex; align-items: center; gap: 8px; margin: 14px 0 8px;
  color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
}
.turnsep::before, .turnsep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.step {
  margin: 0 0 6px; padding: 6px 9px 6px 11px; background: var(--panel2);
  border-radius: 6px; border-left: 3px solid var(--line);
}
.step.prior { opacity: .55; }
.step.user { border-left-color: var(--user); }
.step.assistant { border-left-color: var(--asst); }
.step.tool_call, .step.tool_result { border-left-color: var(--tool); }
.step.bad { border-left-color: var(--err); }
.step .who { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.step .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.step pre {
  margin: 3px 0 0; font-family: var(--mono); font-size: 11px; white-space: pre-wrap;
  overflow-wrap: anywhere; color: var(--dim); max-height: 260px; overflow-y: auto;
}
.step details summary { cursor: pointer; color: var(--dim); font-size: 12px; }
.note {
  font-size: 11px; color: var(--faint); border-top: 1px solid var(--line);
  margin-top: 16px; padding-top: 8px;
}
@media (max-width: 1100px) {
  main { grid-template-columns: 240px 1fr; }
  .right { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
  body { overflow: auto; height: auto; min-height: 100vh; }
  .mapwrap { height: 60vh; }
}
</style>
</head>
<body>
<header>
  <h1>Trace map</h1>
  <span id="runmeta" class="pills" style="margin:0"></span>
  <input id="search" type="search" placeholder="Search titles, goals, tools  ( / )">
</header>
<main>
  <section class="col left">
    <h4>Clusters <span class="faint" style="text-transform:none;letter-spacing:0">· click to color, up to 3</span></h4>
    <div id="clusters"></div>
  </section>

  <section class="mapwrap" id="mapwrap">
    <canvas id="map" aria-label="Scatter plot of traces by embedded summary"></canvas>
    <div class="maptools">
      <button id="reset" title="Reset zoom (0)">Reset view</button>
      <button id="clear" title="Clear highlights (Esc)">Clear</button>
      <label class="small muted"><input type="checkbox" id="numbers" checked> numbers</label>
    </div>
    <div class="legend" id="legend"></div>
    <div id="tip"></div>
    <div class="empty" id="empty" hidden></div>
  </section>

  <section class="col right" id="detail">
    <p class="muted">Click a point to read the trace. Nearby points had similar
      summaries; a cluster number sits just above each cluster.</p>
    <p class="faint small">Drag to pan, scroll to zoom. <kbd>/</kbd> searches,
      <kbd>Esc</kbd> clears.</p>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SLOTS = ["--s1", "--s2", "--s3"].map((v) =>
  getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const state = {
  run: null, pool: {},
  points: [],           // {id, x, y, cluster, summary, source, hay}
  byId: new Map(),
  clusterById: new Map(),
  highlight: [],        // cluster ids, in the order picked; index = color slot
  open: null,           // cluster id expanded in the list
  selected: null,       // trace id
  hover: null,
  query: "",
  view: { k: 1, tx: 0, ty: 0 },
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
async function getJSON(url, opts) {
  const res = await fetch(url, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `${res.status} ${res.statusText}`);
  return body;
}

// ---------------------------------------------------------------- url state

function readHash() {
  return new URLSearchParams(location.hash.slice(1)).get("trace");
}
function writeHash() {
  history.replaceState(null, "", state.selected ? "#trace=" + encodeURIComponent(state.selected) : "#");
}

// ---------------------------------------------------------------- loading

function showEmpty(html) {
  const el = $("empty");
  el.innerHTML = `<div>${html}</div>`;
  el.hidden = !html;
}

function load(run) {
  state.run = run;
  state.pool = run.pool || {};
  state.clusterById = new Map(run.clusters.map((c) => [c.cluster, c]));
  state.points = Object.entries(run.traces).map(([tid, t]) => {
    const s = t.summary || {};
    const tools = (s.tool_activity || []).map((a) => `${a.name} ${a.result}`).join(" ");
    return {
      id: tid, x: t.x, y: t.y, cluster: t.cluster, summary: s, source: t.summary_source,
      hay: `${tid} ${s.title} ${s.user_goal} ${s.outcome} ${tools}`.toLowerCase(),
    };
  });
  state.byId = new Map(state.points.map((p) => [p.id, p]));
  const want = readHash();
  state.selected = want && state.byId.has(want) ? want : null;
  state.open = state.selected ? state.byId.get(state.selected).cluster : null;
  showEmpty(state.points.length ? "" : "This build has no traces.");
  renderMeta();
  fitView();
  renderClusters();
  renderDetail();
  draw();
}

function renderMeta() {
  const b = state.run.backends || {};
  const live = (s) => /live/.test(s || "");
  const pill = (text, isLive) => `<span class="pill${isLive ? " live" : ""}" title="${esc(text)}">${esc(text)}</span>`;
  $("runmeta").innerHTML = [
    pill(`${state.run.n_traces} traces · source ${state.run.source}`),
    pill(`summaries: ${b.summarizer}`, live(b.summarizer)),
    pill(`embedder: ${b.embedder}`, live(b.embedder)),
    pill(`clusters: HDBSCAN on ${b.reducer}`),
    pill(`layout: ${b.projection || b.reducer}`),
  ].join("");
}

// ---------------------------------------------------------------- cluster list

function slotOf(cluster) {
  const i = state.highlight.indexOf(cluster);
  return i < 0 ? null : SLOTS[i];
}

function toggleHighlight(cluster) {
  const i = state.highlight.indexOf(cluster);
  if (i >= 0) state.highlight.splice(i, 1);
  else {
    // Color follows the cluster: dropping the oldest never repaints the rest.
    if (state.highlight.length === 3) state.highlight.shift();
    state.highlight.push(cluster);
  }
}

function renderClusters() {
  const run = state.run;
  const q = state.query;
  const rows = run.clusters.map((c) => ({ ...c }));
  rows.push({ cluster: -1, label: "Unclustered: no group explains these", size: run.unclustered.length,
              representatives: [], members: run.unclustered });
  $("clusters").innerHTML = rows.filter((c) => c.size).map((c) => {
    const color = slotOf(c.cluster);
    const sw = c.cluster === -1
      ? `<span class="sw ring"></span>`
      : `<span class="sw" style="${color ? `background:${color}` : ""}"></span>`;
    const hits = q ? c.members.filter((m) => state.byId.get(m)?.hay.includes(q)).length : null;
    let html = `<div class="cl${state.open === c.cluster ? " on" : ""}" data-c="${c.cluster}">
      ${sw}<span class="num">${c.cluster === -1 ? "–" : "#" + c.cluster}</span>
      <span class="lab">${esc(c.label)}</span>
      <span class="n">${hits !== null ? `${hits}/` : ""}${c.size}</span></div>`;
    if (state.open === c.cluster) {
      const reps = new Set(c.representatives);
      const order = [...c.representatives, ...c.members.filter((m) => !reps.has(m))];
      html += `<div class="members">` + order.map((m) => {
        const p = state.byId.get(m);
        if (!p || (q && !p.hay.includes(q))) return "";
        return `<a href="#" data-t="${esc(m)}" class="${m === state.selected ? "sel" : ""}"
          title="${esc(p.summary.title)}">${reps.has(m) ? `<span class="rep">REP</span>` : ""}${esc(p.summary.title || m)}</a>`;
      }).join("") + `</div>`;
    }
    return html;
  }).join("");
}

$("clusters").addEventListener("click", (e) => {
  const link = e.target.closest("a[data-t]");
  if (link) { e.preventDefault(); select(link.dataset.t); return; }
  const row = e.target.closest(".cl");
  if (!row) return;
  const c = Number(row.dataset.c);
  if (c !== -1) toggleHighlight(c);
  state.open = state.open === c && !state.highlight.includes(c) ? null : c;
  renderClusters();
  draw();
});

// ---------------------------------------------------------------- map

const canvas = $("map");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, base = { sx: 1, ox: 0, oy: 0 };

function resize() {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeBase();
  draw();
}
function computeBase() {
  if (!state.points.length) return;
  const xs = state.points.map((p) => p.x), ys = state.points.map((p) => p.y);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const pad = 40;
  const sx = Math.min((W - 2 * pad) / (x1 - x0 || 1), (H - 2 * pad) / (y1 - y0 || 1));
  base = { sx, ox: W / 2 - sx * (x0 + x1) / 2, oy: H / 2 + sx * (y0 + y1) / 2 };
}
function fitView() { state.view = { k: 1, tx: 0, ty: 0 }; computeBase(); }
function toScreen(p) {
  const { k, tx, ty } = state.view;
  return [k * (base.sx * p.x + base.ox) + tx, k * (-base.sx * p.y + base.oy) + ty];
}

function matches(p) { return !state.query || p.hay.includes(state.query); }

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (!state.points.length) return;
  const surface = css("--panel"), faint = css("--point"), ink = css("--ink");
  ctx.fillStyle = surface; ctx.fillRect(0, 0, W, H);
  const focus = state.highlight.length > 0 || !!state.query;

  // Faded marks first, then emphasized ones on top.
  const layers = [[], []];
  for (const p of state.points) {
    const on = matches(p) && (!state.highlight.length || state.highlight.includes(p.cluster));
    layers[focus && !on ? 0 : 1].push(p);
  }
  layers.forEach((pts, li) => {
    ctx.globalAlpha = li === 0 ? 0.22 : 1;
    for (const p of pts) {
      const [x, y] = toScreen(p);
      if (x < -10 || y < -10 || x > W + 10 || y > H + 10) continue;
      const color = slotOf(p.cluster) || faint;
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2);
      if (p.cluster === -1) {
        ctx.lineWidth = 1.5; ctx.strokeStyle = faint; ctx.stroke();
      } else {
        ctx.fillStyle = color; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = surface; ctx.stroke(); // ring separates overlaps
      }
    }
  });
  ctx.globalAlpha = 1;

  if ($("numbers").checked) drawNumbers(focus);

  for (const [id, r, w] of [[state.hover, 7, 1.5], [state.selected, 8, 2.5]]) {
    const p = id && state.byId.get(id);
    if (!p) continue;
    const [x, y] = toScreen(p);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.lineWidth = w; ctx.strokeStyle = ink; ctx.stroke();
  }
  renderLegend();
}

function drawNumbers(focus) {
  ctx.font = "600 11px system-ui, -apple-system, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const c of state.run.clusters) {
    const members = c.members.map((m) => state.byId.get(m)).filter(Boolean);
    if (!members.length) continue;
    // Sit the badge just above the cluster, not on its centre: a tight UMAP
    // cluster can be smaller than the badge and would vanish under it.
    const screen = members.map(toScreen);
    const x = screen.reduce((s, [px]) => s + px, 0) / screen.length;
    const y = Math.min(...screen.map(([, py]) => py)) - 15;
    const text = "#" + c.cluster;
    const w = ctx.measureText(text).width + 8;
    ctx.globalAlpha = focus && !state.highlight.includes(c.cluster) ? 0.35 : 0.95;
    ctx.fillStyle = "#0d0f14"; ctx.strokeStyle = css("--line"); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - 8, w, 16, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = css("--ink"); ctx.fillText(text, x, y + 0.5);
  }
  ctx.globalAlpha = 1;
}

function renderLegend() {
  const items = state.highlight.map((c, i) =>
    `<span><i style="background:${SLOTS[i]}"></i>#${c} (${state.clusterById.get(c)?.size ?? 0})</span>`);
  items.push(`<span><i style="background:${css("--point")}"></i>${state.highlight.length ? "other clusters" : "clustered"}</span>`);
  items.push(`<span><i class="ring"></i>unclustered</span>`);
  if (state.query) {
    const n = state.points.filter(matches).length;
    items.push(`<span>“${esc(state.query)}”: ${n} match${n === 1 ? "" : "es"}</span>`);
  }
  $("legend").innerHTML = items.join("");
}

function nearest(mx, my) {
  let best = null, bd = 12 * 12; // hit radius larger than the mark
  for (const p of state.points) {
    const [x, y] = toScreen(p);
    const d = (x - mx) ** 2 + (y - my) ** 2;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, y: e.clientY, tx: state.view.tx, ty: state.view.ty, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  const r = canvas.getBoundingClientRect();
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { drag.moved = true; canvas.classList.add("drag"); }
    if (drag.moved) { state.view.tx = drag.tx + dx; state.view.ty = drag.ty + dy; hideTip(); draw(); return; }
  }
  const p = nearest(e.clientX - r.left, e.clientY - r.top);
  if ((p && p.id) !== state.hover) { state.hover = p && p.id; draw(); }
  if (p) showTip(p, e.clientX - r.left, e.clientY - r.top); else hideTip();
});
canvas.addEventListener("pointerup", (e) => {
  canvas.classList.remove("drag");
  const moved = drag && drag.moved;
  drag = null;
  if (moved) return;
  const r = canvas.getBoundingClientRect();
  const p = nearest(e.clientX - r.left, e.clientY - r.top);
  if (p) select(p.id);
});
canvas.addEventListener("pointerleave", () => { if (!drag) { state.hover = null; hideTip(); draw(); } });
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0015);
  const k = Math.min(40, Math.max(0.5, state.view.k * f));
  const g = k / state.view.k;
  state.view.tx = mx - g * (mx - state.view.tx);
  state.view.ty = my - g * (my - state.view.ty);
  state.view.k = k;
  draw();
}, { passive: false });

function showTip(p, x, y) {
  const tip = $("tip");
  const c = p.cluster === -1 ? "unclustered" : `cluster #${p.cluster}`;
  tip.innerHTML = `<div class="t">${esc(p.summary.title || p.id)}</div>
    <div class="muted">${esc(c)} · <span class="mono">${esc(p.id.slice(0, 8))}</span></div>
    ${p.summary.user_goal ? `<div>${esc(p.summary.user_goal)}</div>` : ""}`;
  tip.style.display = "block";
  const wrap = $("mapwrap").getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(x + 14, wrap.width - tw - 6) + "px";
  tip.style.top = (y + 14 + th > wrap.height ? y - th - 10 : y + 14) + "px";
}
function hideTip() { $("tip").style.display = "none"; }

// ---------------------------------------------------------------- detail

function select(id) {
  state.selected = id;
  const p = state.byId.get(id);
  if (p) state.open = p.cluster;
  renderClusters();
  renderDetail();
  draw();
  writeHash();
  document.querySelector(".members a.sel")?.scrollIntoView({ block: "nearest" });
}

function stepHTML(s, prior) {
  const cls = `step ${esc(s.role)}${prior ? " prior" : ""}`;
  if (s.role === "user" || s.role === "assistant") {
    return `<div class="${cls}"><div class="who">${esc(s.role)}</div><div class="txt">${esc(s.text)}</div></div>`;
  }
  if (s.role === "tool_call") {
    return `<div class="${cls}"><div class="who">tool call · ${esc(s.name)}</div>
      <pre>${esc(JSON.stringify(s.arguments ?? {}, null, 1))}</pre></div>`;
  }
  if (s.role === "tool_result") {
    const c = s.content;
    const bad = c && typeof c === "object" && (c.ok === false || c.error);
    const json = JSON.stringify(c, null, 1) ?? "";
    const body = json.length > 400
      ? `<details><summary>${esc(json.slice(0, 90))}…</summary><pre>${esc(json)}</pre></details>`
      : `<pre>${esc(json)}</pre>`;
    return `<div class="${cls}${bad ? " bad" : ""}"><div class="who">tool result · ${esc(s.name)}</div>${body}</div>`;
  }
  return `<div class="${cls}"><div class="who">${esc(s.role)}</div><pre>${esc(JSON.stringify(s, null, 1))}</pre></div>`;
}

function renderDetail() {
  const el = $("detail");
  const p = state.selected && state.byId.get(state.selected);
  if (!p) return;
  const s = p.summary;
  const rec = state.pool[p.id];
  const sess = rec?.session || {};
  const cl = p.cluster === -1 ? "unclustered" : `cluster #${p.cluster}`;
  const pills = [
    `<span class="pill">${esc(cl)}</span>`,
    `<span class="pill${/llm/.test(p.source) ? " live" : ""}">summary: ${esc(p.source)}</span>`,
    rec?.user_role ? `<span class="pill">${esc(rec.user_role)}</span>` : "",
    sess.turn_count > 1 ? `<span class="pill">turn ${sess.turn_index + 1} of ${sess.turn_count}</span>` : "",
    `<span class="pill mono" title="trace id">${esc(p.id.slice(0, 12))}</span>`,
  ].join("");

  let html = `<div class="title">${esc(s.title || p.id)}</div><div class="pills">${pills}</div>`;
  html += `<h4>Summary <span class="faint" style="text-transform:none;letter-spacing:0">· what was embedded</span></h4>`;
  if (s.user_goal) html += `<p class="kv"><span class="muted">Goal.</span> ${esc(s.user_goal)}</p>`;
  if (s.flow?.length) html += `<ul class="tight">${s.flow.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>`;
  if (s.tool_activity?.length) {
    html += `<ul class="tight">${s.tool_activity.map((t) =>
      `<li class="tool">${esc(t.name)}(${esc(t.arguments)})${t.result ? ` <span class="arrow">→</span> ${esc(t.result)}` : ""}</li>`).join("")}</ul>`;
  }
  if (s.outcome) html += `<p class="kv"><span class="muted">Outcome.</span> ${esc(s.outcome)}</p>`;
  if (s.notable?.length) html += `<ul class="tight">${s.notable.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>`;

  html += `<h4>Conversation</h4>`;
  if (!rec) {
    html += `<p class="muted">This trace is not in the review pool, so its steps are not available here.</p>`;
  } else {
    const prior = sess.prior_trace_ids || [];
    prior.forEach((pid, i) => {
      html += `<div class="turnsep">turn ${i + 1} (earlier)</div>`;
      const pr = state.pool[pid];
      html += pr ? pr.steps.map((st) => stepHTML(st, true)).join("")
                 : `<p class="faint small">Earlier turn ${esc(pid.slice(0, 8))} is not in the pool.</p>`;
    });
    if (prior.length) html += `<div class="turnsep">turn ${prior.length + 1} (this trace)</div>`;
    html += rec.steps.map((st) => stepHTML(st, false)).join("");
  }
  html += `<div class="note">Clusters are a sampling aid: they say which traces resemble each
    other, not which ones failed. Read the conversation before naming a failure.</div>`;
  el.innerHTML = html;
  el.scrollTop = 0;
}



$("search").addEventListener("input", (e) => {
  state.query = e.target.value.trim().toLowerCase();
  renderClusters(); draw();
});
$("numbers").addEventListener("change", draw);
$("reset").addEventListener("click", () => { fitView(); draw(); });
$("clear").addEventListener("click", clearAll);
function clearAll() {
  state.highlight = []; state.query = ""; $("search").value = "";
  renderClusters(); draw();
}
document.addEventListener("keydown", (e) => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("search").focus(); }
  else if (e.key === "Escape") { if (typing) document.activeElement.blur(); clearAll(); }
  else if (e.key === "0" && !typing) { fitView(); draw(); }
});
new ResizeObserver(resize).observe($("mapwrap"));

// The build step replaces the slot below with the map data.
const MAP_DATA = /*MAP_DATA*/null;
if (MAP_DATA) load(MAP_DATA);
else showEmpty("No map data. Build the page with " +
  "<code>uv run --extra trace-map python -m analysis.trace_map --open</code>.");
</script>
</body>
